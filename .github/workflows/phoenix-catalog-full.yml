name: Phoenix full priced building-supply catalog

on:
  push:
    branches:
      - catalog/full-priced-products-photos-20260908-v3
    paths:
      - "catalog-pipeline/**"
      - ".github/workflows/phoenix-catalog-full.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: phoenix-full-priced-catalog-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  CATALOG_SHARD_SECONDS: "19800"
  CATALOG_SITE_SECONDS: "900"
  CATALOG_PRIORITY_SITE_SECONDS: "1800"
  CATALOG_MAX_PRODUCT_PAGES: "250000"
  CATALOG_MAX_DISCOVERED_URLS: "1000000"
  CATALOG_MAX_SITEMAPS: "3000"
  CATALOG_PAGE_WORKERS: "1"
  CATALOG_IMAGE_WORKERS: "1"
  CATALOG_IMAGE_MAX_SIDE: "320"
  CATALOG_IMAGE_QUALITY: "60"
  CATALOG_REQUEST_GAP: "0.30"

jobs:
  crawl:
    name: Crawl all 25 supplier shards on one hosted runner
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out catalog branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify catalog pipeline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/catalog
          cat \
            catalog-pipeline/pipeline.b64.part00a \
            catalog-pipeline/pipeline.b64.part00b \
            catalog-pipeline/pipeline.b64.part01 \
            catalog-pipeline/pipeline.b64.part02 \
            catalog-pipeline/pipeline.b64.part03 \
            catalog-pipeline/pipeline.b64.part04 \
            catalog-pipeline/pipeline.b64.part05 \
            catalog-pipeline/pipeline.b64.part06 \
            catalog-pipeline/pipeline.b64.part07 \
            > /tmp/catalog-pipeline.tar.gz.b64
          base64 --decode /tmp/catalog-pipeline.tar.gz.b64 > /tmp/catalog-pipeline.tar.gz
          test -s /tmp/catalog-pipeline.tar.gz
          tar -tzf /tmp/catalog-pipeline.tar.gz
          tar -xzf /tmp/catalog-pipeline.tar.gz -C /tmp/catalog
          test -s /tmp/catalog/catalog_pipeline.py
          test -s /tmp/catalog/requirements.txt
          test -s /tmp/catalog/supplier_master_500.csv.gz

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r /tmp/catalog/requirements.txt

      - name: Verify all 500 company assignments and pipeline syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile /tmp/catalog/catalog_pipeline.py
          python - <<'PY'
          import csv, gzip
          with gzip.open('/tmp/catalog/supplier_master_500.csv.gz', 'rt', encoding='utf-8-sig', newline='') as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 500, len(rows)
          assert len({row['Supplier_ID'] for row in rows}) == 500
          assignments = {i: sum(1 for n in range(len(rows)) if n % 25 == i) for i in range(25)}
          assert sum(assignments.values()) == 500
          assert set(assignments.values()) == {20}, assignments
          print('Verified 500 unique suppliers and 20 suppliers in each of 25 shards')
          PY

      - name: Collect every publicly accessible positive-price product and its discovered images
        shell: bash
        run: |
          set -euo pipefail
          ulimit -n 65535 || true
          mkdir -p crawl-output
          pids=()
          for SHARD in $(seq 0 24); do
            mkdir -p "crawl-output/shard_${SHARD}"
            (
              python /tmp/catalog/catalog_pipeline.py crawl \
                --input /tmp/catalog/supplier_master_500.csv.gz \
                --output "crawl-output/shard_${SHARD}" \
                --shard "$SHARD" \
                --shards 25 \
                > "crawl-output/shard_${SHARD}/run.log" 2>&1
            ) &
            pids+=("$!")
          done
          failure=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then
              failure=1
            fi
          done
          find crawl-output -name summary.json -print -exec cat {} \; || true
          exit "$failure"

      - name: Show crawl coverage
        if: always()
        shell: bash
        run: |
          find crawl-output -name summary.json -print -exec cat {} \; || true
          find crawl-output -name supplier_status.csv -print | wc -l
          du -sh crawl-output || true

      - name: Upload crawl batch 00-04
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-full-crawl-batch-00-04
          path: |
            crawl-output/shard_0
            crawl-output/shard_1
            crawl-output/shard_2
            crawl-output/shard_3
            crawl-output/shard_4
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

      - name: Upload crawl batch 05-09
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-full-crawl-batch-05-09
          path: |
            crawl-output/shard_5
            crawl-output/shard_6
            crawl-output/shard_7
            crawl-output/shard_8
            crawl-output/shard_9
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

      - name: Upload crawl batch 10-14
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-full-crawl-batch-10-14
          path: |
            crawl-output/shard_10
            crawl-output/shard_11
            crawl-output/shard_12
            crawl-output/shard_13
            crawl-output/shard_14
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

      - name: Upload crawl batch 15-19
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-full-crawl-batch-15-19
          path: |
            crawl-output/shard_15
            crawl-output/shard_16
            crawl-output/shard_17
            crawl-output/shard_18
            crawl-output/shard_19
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

      - name: Upload crawl batch 20-24
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-full-crawl-batch-20-24
          path: |
            crawl-output/shard_20
            crawl-output/shard_21
            crawl-output/shard_22
            crawl-output/shard_23
            crawl-output/shard_24
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

  merge-release:
    name: Merge, validate, and publish shareable release
    needs: crawl
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out catalog branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify catalog pipeline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/catalog
          cat \
            catalog-pipeline/pipeline.b64.part00a \
            catalog-pipeline/pipeline.b64.part00b \
            catalog-pipeline/pipeline.b64.part01 \
            catalog-pipeline/pipeline.b64.part02 \
            catalog-pipeline/pipeline.b64.part03 \
            catalog-pipeline/pipeline.b64.part04 \
            catalog-pipeline/pipeline.b64.part05 \
            catalog-pipeline/pipeline.b64.part06 \
            catalog-pipeline/pipeline.b64.part07 \
            > /tmp/catalog-pipeline.tar.gz.b64
          base64 --decode /tmp/catalog-pipeline.tar.gz.b64 > /tmp/catalog-pipeline.tar.gz
          test -s /tmp/catalog-pipeline.tar.gz
          tar -xzf /tmp/catalog-pipeline.tar.gz -C /tmp/catalog

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging dependencies
        run: python -m pip install --disable-pip-version-check -r /tmp/catalog/requirements.txt

      - name: Download all five crawl batches
        uses: actions/download-artifact@v4
        with:
          pattern: phoenix-full-crawl-batch-*
          path: crawl-artifacts

      - name: Build and validate final priced-only catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          python /tmp/catalog/catalog_pipeline.py merge \
            --input-root crawl-artifacts \
            --supplier-master /tmp/catalog/supplier_master_500.csv.gz \
            --output release
          cat release/VALIDATION.txt
          cat release/release_manifest.json

      - name: Publish public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="phoenix-full-priced-catalog-${GITHUB_RUN_ID}"
          shopt -s nullglob
          ASSETS=(
            release/*.zip
            release/*.xlsx
            release/*.sqlite
            release/*.csv
            release/*.gz
            release/*.txt
            release/*.json
          )
          if (( ${#ASSETS[@]} == 0 )); then
            echo "No release assets were generated." >&2
            exit 1
          fi
          gh release create "$TAG" "${ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Phoenix Full Priced Building-Supply Catalog ${GITHUB_RUN_ID}" \
            --notes-file release/README.md
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          {
            echo "## Shareable full catalog release"
            echo
            echo "$RELEASE_URL"
            echo
            cat release/release_manifest.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged release as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-full-priced-catalog-release-${{ github.run_id }}
          path: release
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
