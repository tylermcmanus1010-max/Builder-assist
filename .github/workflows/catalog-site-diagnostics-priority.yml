name: Priority catalog template diagnostics

on:
  push:
    branches:
      - catalog/full-priced-products-photos-20260907-v1
    paths:
      - ".github/workflows/catalog-site-diagnostics-priority.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phoenix-full-priced-catalog-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install inspection dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Inspect public product templates
        run: |
          cat > /tmp/inspect.py <<'PY'
          import json, re, pathlib, urllib.parse
          import requests
          from bs4 import BeautifulSoup

          targets = {
              "menards_product": "https://www.menards.com/main/building-materials/lumber-boards/dimensional-lumber/ac2-reg-2-x-12-2-prime-ground-contact-green-pressure-treated-lumber/1111900/p-1444422188929-c-13125.htm",
              "menards_robots": "https://www.menards.com/robots.txt",
              "az_appliance_whirlpool": "https://www.arizonaapplianceandhome.com/catalog/special/manufacturer/Whirlpool",
              "az_discount_freezers": "https://www.arizonadiscountappliance.com/catalog/freezers",
          }
          out = pathlib.Path("diagnostics")
          out.mkdir(exist_ok=True)
          session = requests.Session()
          session.headers.update({"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128 Safari/537.36", "Accept-Language": "en-US,en;q=0.9"})
          endpoint_re = re.compile(r"(?:https?:)?//[^\"'<> ]+|/[A-Za-z0-9_.~!$&()*+,;=:@%/?#-]+")
          markers = ("api", "graphql", "catalog", "product", "search", "model", "price", "algolia", "elastic", "endpoint", "json")
          for name, url in targets.items():
              print("\n=====", name, url, "=====")
              try:
                  response = session.get(url, timeout=45, allow_redirects=True)
              except Exception as exc:
                  print("REQUEST ERROR", type(exc).__name__, exc)
                  continue
              print("status", response.status_code, "final", response.url, "bytes", len(response.content), "ctype", response.headers.get("content-type"))
              suffix = ".txt" if "text/plain" in response.headers.get("content-type", "") else ".html"
              (out / f"{name}{suffix}").write_bytes(response.content)
              if suffix == ".txt":
                  print(response.text[:30000])
                  continue
              html = response.text
              soup = BeautifulSoup(html, "lxml")
              print("title", soup.title.get_text(" ", strip=True) if soup.title else "")
              print("anchors", len(soup.find_all("a", href=True)), "scripts", len(soup.find_all("script")), "images", len(soup.find_all("img")))
              hrefs = []
              for a in soup.find_all("a", href=True):
                  href = urllib.parse.urljoin(response.url, a.get("href"))
                  text = a.get_text(" ", strip=True)
                  if any(token in href.lower() for token in ("/product", "/products", "/catalog/", "p-", "model")):
                      hrefs.append((href, text[:160]))
              print("PRODUCT-LIKE HREFS")
              for item in hrefs[:200]: print("HREF", item)
              print("SCRIPT SOURCES")
              for script in soup.find_all("script", src=True)[:200]: print("SCRIPT", urllib.parse.urljoin(response.url, script.get("src")))
              print("JSON-LD")
              for index, script in enumerate(soup.find_all("script", attrs={"type": re.compile("ld\\+json", re.I)})[:50]):
                  raw = (script.string or script.get_text() or "").strip()
                  print("JSONLD", index, raw[:5000].replace("\n", " "))
              lowered = html.lower()
              for needle in ("wmh31017hw", "mzf34x20dw", "1111900", "1444422188929", "sale $", "model #", "model #:", "add to cart", "__next_data__"):
                  pos = lowered.find(needle.lower())
                  print("NEEDLE", needle, "POSITION", pos)
                  if pos >= 0: print(html[max(0, pos-1500):pos+5000].replace("\n", " "))
              candidates = []
              for value in endpoint_re.findall(html):
                  if any(marker in value.lower() for marker in markers) and value not in candidates: candidates.append(value)
              print("ENDPOINT CANDIDATES")
              for value in candidates[:400]: print("ENDPOINT", value[:1500])
              print("INLINE SCRIPTS")
              for index, script in enumerate(soup.find_all("script")):
                  if script.get("src"): continue
                  raw = script.string or script.get_text() or ""
                  if any(marker in raw.lower() for marker in markers): print("INLINE", index, raw[:12000].replace("\n", " "))
          PY
          python /tmp/inspect.py | tee diagnostics/report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: priority-catalog-site-diagnostics
          path: diagnostics
          retention-days: 2
          compression-level: 6
