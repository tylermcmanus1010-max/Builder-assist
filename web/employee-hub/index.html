<meta charset="utf-8">
<title>Builder Assist Employee Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --ink:#071a36; --navy:#081f43; --blue:#0b4fd3; --blue-bright:#1674ff;
    --cyan:#68d4ff; --ice:#f2f7ff; --line:#d9e5f7; --muted:#5e6f89;
    --bg:#f2f7ff; --panel:#ffffff; --text:#071a36; --head:#081f43;
    --ok:#0e7d3e; --ok-bg:#e6f6ec; --warn:#8a5b00; --warn-bg:#fff3d6;
    --bad:#b3261e; --bad-bg:#fdecea; --soft:#7a4bd6; --soft-bg:#f1eafd;
    --demo:#8a5b00; --demo-bg:#fff3d6;
    --btn-text:#ffffff; --shadow:0 1px 3px rgba(7,26,54,.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#050e1d; --panel:#0a1b33; --text:#eaf2ff; --head:#eaf2ff;
      --line:#1c3357; --muted:#8fa3c0; --ice:#0d2242;
      --ok:#5fd48f; --ok-bg:#0b2b1a; --warn:#ffd479; --warn-bg:#33270a;
      --bad:#ff8d85; --bad-bg:#3a100e; --soft:#c1a4ff; --soft-bg:#221540;
      --demo:#ffd479; --demo-bg:#33270a;
      --shadow:0 1px 3px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#050e1d; --panel:#0a1b33; --text:#eaf2ff; --head:#eaf2ff;
    --line:#1c3357; --muted:#8fa3c0; --ice:#0d2242;
    --ok:#5fd48f; --ok-bg:#0b2b1a; --warn:#ffd479; --warn-bg:#33270a;
    --bad:#ff8d85; --bad-bg:#3a100e; --soft:#c1a4ff; --soft-bg:#221540;
    --demo:#ffd479; --demo-bg:#33270a;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.45}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px 60px}
  header.site{background:var(--navy);color:#fff;padding:18px 0}
  header.site .wrap{padding-bottom:0}
  .brandrow{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
  .brand{font-weight:900;letter-spacing:.16em;text-transform:uppercase;font-size:17px;color:#fff}
  .brand span{color:var(--cyan)}
  .eyebrow{color:var(--cyan);font-weight:800;text-transform:uppercase;letter-spacing:.16em;font-size:11px;margin:0 0 6px}
  .sessionbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
    margin-top:14px;padding:10px 0 12px;border-top:1px solid rgba(255,255,255,.18);color:#cfe0ff;font-size:13px}
  .sessionbar .who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .sessionbar .nm{color:#fff;font-weight:900;letter-spacing:.06em}
  .rolechip{display:inline-block;padding:4px 10px;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.14em}
  .rolechip.employer{background:var(--cyan);color:#04203f}
  .rolechip.employee{background:#cfe0ff;color:#08214a}
  h1,h2,h3{color:var(--head);margin:0 0 10px;letter-spacing:.02em}
  h1{font-size:22px;text-transform:uppercase;letter-spacing:.1em;font-weight:900}
  h2{font-size:20px;text-transform:uppercase;letter-spacing:.08em;font-weight:900}
  h3{font-size:14px;text-transform:uppercase;letter-spacing:.12em;font-weight:800}
  h3 .count{margin-left:8px}
  .demo-banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
    background:var(--demo-bg);color:var(--demo);border:1px dashed var(--demo);padding:10px 14px;margin:18px 0;
    font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.1em}
  .demo-banner .note{font-weight:normal;text-transform:none;letter-spacing:0;font-size:13px}
  .card{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);padding:18px;margin:0 0 18px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:860px){.grid2{grid-template-columns:1fr}}
  label.fld{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:0 0 4px}
  select,input[type=datetime-local],input[type=number],input[type=text],textarea{
    width:100%;padding:9px 10px;border:1px solid var(--line);background:var(--panel);color:var(--text);
    font-family:inherit;font-size:14px;border-radius:0}
  textarea{resize:vertical;min-height:64px}
  .btn{appearance:none;border:none;border-radius:0;cursor:pointer;font-family:inherit;
    font-weight:900;text-transform:uppercase;letter-spacing:.14em;font-size:12px;padding:12px 20px;
    background:var(--blue);color:var(--btn-text)}
  .btn:hover{background:var(--blue-bright)}
  .btn.secondary{background:transparent;color:var(--blue-bright);border:1px solid var(--blue-bright)}
  .btn.danger{background:var(--bad);color:#fff}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn.small{padding:6px 10px;font-size:10px;letter-spacing:.1em}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .clockbig{font-size:44px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--head)}
  .statuschip{display:inline-block;padding:4px 10px;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.12em}
  .chip-on{background:var(--ok-bg);color:var(--ok)}
  .chip-break{background:var(--warn-bg);color:var(--warn)}
  .chip-off{background:var(--ice);color:var(--muted)}
  .chip-stale{background:var(--bad-bg);color:var(--bad)}
  .flag{display:inline-block;padding:2px 8px;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;margin:1px 2px 1px 0;white-space:nowrap}
  .flag.hard{background:var(--bad-bg);color:var(--bad)}
  .flag.soft{background:var(--soft-bg);color:var(--soft)}
  .flag.warn{background:var(--warn-bg);color:var(--warn)}
  .flag.demo{background:var(--demo-bg);color:var(--demo)}
  .flag.ok{background:var(--ok-bg);color:var(--ok)}
  .flag.info{background:var(--ice);color:var(--muted)}
  .count{display:inline-block;min-width:22px;text-align:center;padding:2px 8px;font-size:11px;font-weight:900;
    letter-spacing:.06em;background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}
  .count.zero{background:var(--ice);color:var(--muted);border-color:var(--line)}
  .tablewrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
  th{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);text-align:left;
    border-bottom:2px solid var(--line);padding:8px 10px;white-space:nowrap}
  td{border-bottom:1px solid var(--line);padding:8px 10px;font-size:13px;vertical-align:top}
  td.num,th.num{text-align:right}
  tr.totalrow td{font-weight:900;border-top:2px solid var(--line);background:var(--ice)}
  .muted{color:var(--muted)}
  .small{font-size:12px}
  .roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .roster .emp{border:1px solid var(--line);padding:12px;background:var(--panel)}
  .roster .emp .nm{font-weight:900;letter-spacing:.04em}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:baseline}
  .dot.on{background:var(--ok)} .dot.break{background:var(--warn)} .dot.off{background:var(--muted)} .dot.stale{background:var(--bad)}
  .weeknav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .weeknav .range{font-weight:900;letter-spacing:.04em}
  .alert{padding:12px 14px;margin:0 0 14px;font-size:13px;border:1px solid}
  .alert.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
  .alert.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
  .alert.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
  .audit{background:var(--ice);border:1px dashed var(--line);padding:8px 10px;font-size:12px;margin-top:6px}
  .audit del{color:var(--bad)}
  .audit ins{color:var(--ok);text-decoration:none;font-weight:700}
  dialog{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0;max-width:560px;width:92%}
  dialog::backdrop{background:rgba(7,26,54,.55)}
  dialog .dlg-head{background:var(--navy);color:#fff;padding:12px 18px;font-weight:900;text-transform:uppercase;letter-spacing:.14em;font-size:12px}
  dialog .dlg-body{padding:18px}
  .formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  @media(max-width:560px){.formrow{grid-template-columns:1fr}}
  .footer-note{color:var(--muted);font-size:12px;margin-top:26px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;
    padding:10px 18px;font-size:13px;font-weight:700;letter-spacing:.04em;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
  .kv{display:flex;gap:26px;flex-wrap:wrap;margin:10px 0 0}
  .kv .k{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
  .kv .v{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
  /* --- sign-in --- */
  .signin{max-width:620px;margin:34px auto 0}
  .rolepick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 16px}
  @media(max-width:620px){.rolepick{grid-template-columns:1fr}}
  .rolepick button{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;
    width:100%;height:100%;text-align:left;border:1px solid var(--line);border-radius:0;
    background:var(--panel);color:var(--text);padding:14px;cursor:pointer;font-family:inherit}
  .rolepick button.sel{border-color:var(--blue-bright);background:var(--ice);box-shadow:inset 0 0 0 2px var(--blue-bright)}
  .rolepick .rt{font-weight:900;text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--head)}
  .rolepick .rd{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.4}
  .perms{font-size:12px;color:var(--muted);margin:10px 0 0;padding-left:18px}
  .perms li{margin:3px 0}
  /* --- requests --- */
  .reqcard{border:1px solid var(--line);border-left:4px solid var(--line);padding:12px 14px;margin:0 0 12px;background:var(--panel)}
  .reqcard.pending{border-left-color:var(--warn)}
  .reqcard.approved{border-left-color:var(--ok)}
  .reqcard.denied{border-left-color:var(--bad)}
  .reqcard.withdrawn{border-left-color:var(--muted)}
  .reqcard .rhead{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between}
  .reqcard .rref{font-weight:900;letter-spacing:.1em;font-size:12px;text-transform:uppercase}
  .reqcard .rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 18px;margin:10px 0 0;font-size:13px}
  .reqcard .rk{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
  .reqcard .reason{margin-top:10px;font-size:13px;background:var(--ice);border:1px dashed var(--line);padding:8px 10px}
  .reqactions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .reqactions input[type=text]{flex:1 1 200px;width:auto}
  .delta{color:var(--muted)}
  .delta del{color:var(--bad)} .delta ins{color:var(--ok);text-decoration:none;font-weight:700}
</style>

<header class="site"><div class="wrap">
  <div class="brandrow">
    <div class="brand">Builder <span>Assist</span> &middot; Employee Hub</div>
    <div class="small" style="color:#cfe0ff">Time clock &amp; hours monitoring</div>
  </div>
  <div id="sessionbar"></div>
</div></header>

<div class="wrap">
  <div id="banner"></div>
  <div id="storage-warning"></div>
  <!-- Everything below is built by JS for the signed-in role only. Surfaces a role
       may not use are never inserted into the document at all - they are not
       hidden, they do not exist, and no handler is bound for them. -->
  <main id="app"></main>
  <p class="footer-note" id="footnote"></p>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
/* =====================================================================
   Employee Hub - two portals, one page.

   * EMPLOYER portal: roster, weekly matrix across all employees, overtime
     flags, approve/reject, edit with audit trail, requests queue, CSV export,
     reset demo data.
   * EMPLOYEE portal: clock in / out / break, request hours, own entries and
     own weekly total. Nothing else.

   The gate is structural: renderApp() writes only the signed-in role's markup
   into #app. An employee's document contains no employer control, so there is
   nothing to un-hide and no handler to trigger. This is still DEMO-GRADE:
   there is no server, so anyone with devtools can call the Store directly.
   Real enforcement needs a backend. See README.

   All timestamps are epoch milliseconds; every duration is derived.
   ===================================================================== */

var HOUR = 3600000, DAY = 86400000;
var STALE_MS = 16 * HOUR;            // open shift older than this is flagged, not counted
var WEEKLY_OT_MS = 40 * HOUR;        // weekly rule (hard flag)
var DAILY_LONG_MS = 8 * HOUR;        // daily rule (soft flag)
var REQ_WINDOW_DAYS = 21;            // how far back an employee may file a correction
var SCHEMA = 'bah.employeehub.v2';

/* ---------------- storage module ----------------
   Interface a real backend would implement (see README):
     listEmployees()  -> [{id,name,role}]
     listManagers()   -> [{id,name,title}]
     listJobs()       -> [{id,name,seeded}]
     listEntries()    -> [entry]
     saveEntry(e)     -> entry              (insert)
     updateEntry(id, patch)   -> entry|null (shallow merge)
     listRequests()   -> [request]
     saveRequest(r)   -> request            (insert)
     updateRequest(id, patch) -> request|null
     getSession()     -> session|null       (a real backend returns this from a
     setSession(s)    -> session             token, and every call above is
     clearSession()   -> void                authorised against it server-side)
     resetDemo()      -> void               (wipe + reseed; demo only)
   Backed by localStorage here, with an in-memory fallback when localStorage
   throws (private windows, embedded contexts). */
var Store = (function () {
  var mem = {};                 // fallback
  var storageOK = true;
  function lsGet(k) {
    try { var v = localStorage.getItem(k); return v == null ? null : JSON.parse(v); }
    catch (e) { storageOK = false; return (k in mem) ? mem[k] : null; }
  }
  function lsSet(k, v) {
    mem[k] = v;
    try { localStorage.setItem(k, JSON.stringify(v)); }
    catch (e) { storageOK = false; }
  }
  function lsDel(k) {
    delete mem[k];
    try { localStorage.removeItem(k); } catch (e) { storageOK = false; }
  }
  var K = {
    emp: SCHEMA + '.employees', mgr: SCHEMA + '.managers', job: SCHEMA + '.jobs',
    ent: SCHEMA + '.entries',   req: SCHEMA + '.requests', ses: SCHEMA + '.session'
  };
  function listEmployees() { return lsGet(K.emp) || []; }
  function listManagers() { return lsGet(K.mgr) || []; }
  function listJobs() { return lsGet(K.job) || []; }
  function listEntries() { return lsGet(K.ent) || []; }
  function listRequests() { return lsGet(K.req) || []; }
  function saveEntry(e) { var a = listEntries(); a.push(e); lsSet(K.ent, a); return e; }
  function saveRequest(r) { var a = listRequests(); a.push(r); lsSet(K.req, a); return r; }
  function patchIn(key, id, patch) {
    var a = lsGet(key) || [];
    for (var i = 0; i < a.length; i++) {
      if (a[i].id === id) {
        for (var k in patch) if (Object.prototype.hasOwnProperty.call(patch, k)) a[i][k] = patch[k];
        lsSet(key, a); return a[i];
      }
    }
    return null;
  }
  function updateEntry(id, patch) { return patchIn(K.ent, id, patch); }
  function updateRequest(id, patch) { return patchIn(K.req, id, patch); }
  function getSession() { return lsGet(K.ses); }
  function setSession(s) { lsSet(K.ses, s); return s; }
  function clearSession() { lsDel(K.ses); }
  function seed(force) {
    if (!force && listEmployees().length && listEntries().length) return;
    var s = buildSeed();
    lsSet(K.emp, s.employees); lsSet(K.mgr, s.managers); lsSet(K.job, s.jobs);
    lsSet(K.ent, s.entries);   lsSet(K.req, s.requests);
  }
  function resetDemo() { seed(true); }
  return { listEmployees: listEmployees, listManagers: listManagers, listJobs: listJobs,
           listEntries: listEntries, listRequests: listRequests,
           saveEntry: saveEntry, updateEntry: updateEntry,
           saveRequest: saveRequest, updateRequest: updateRequest,
           getSession: getSession, setSession: setSession, clearSession: clearSession,
           seed: seed, resetDemo: resetDemo, ok: function () { return storageOK; } };
})();

/* ---------------- time helpers ---------------- */
function addDays(t, n) {
  // Calendar arithmetic, not fixed milliseconds: a DST week is 23 or 25 hours
  // long, so t + n*DAY drifts off midnight and silently misfiles a whole day.
  var d = new Date(t); d.setDate(d.getDate() + n); d.setHours(0, 0, 0, 0);
  return d.getTime();
}
function daysBetween(a, b) {
  // Rounding absorbs the +/-1h DST skew; flooring a 23-hour day would lose one.
  var x = new Date(a); x.setHours(0, 0, 0, 0);
  var y = new Date(b); y.setHours(0, 0, 0, 0);
  return Math.round((y.getTime() - x.getTime()) / DAY);
}
function mondayOf(t) {
  var d = new Date(t); d.setHours(0, 0, 0, 0);
  var dow = (d.getDay() + 6) % 7;           // Mon=0
  return addDays(d.getTime(), -dow);
}
function dayStart(t) { var d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); }
function breakMs(e, now) {
  var s = 0;
  for (var i = 0; i < (e.breaks || []).length; i++) {
    var b = e.breaks[i];
    s += Math.max(0, (b.end == null ? now : b.end) - b.start);
  }
  return s;
}
function workedMs(e, now) {
  var end = e.clockOut == null ? now : e.clockOut;
  return Math.max(0, end - e.clockIn - breakMs(e, now)); // clamp: never negative, midnight-safe
}
function isStale(e, now) { return e.clockOut == null && (now - e.clockIn) > STALE_MS; }
function onBreak(e) {
  var bs = e.breaks || [];
  return bs.length > 0 && bs[bs.length - 1].end == null;
}
function materializeBreak(cin, cout, mins) {
  // one unpaid segment centred mid-shift; timestamps stay the source of truth
  if (!mins) return [];
  var len = mins * 60000;
  var start = cin + Math.round((cout - cin) / 2) - Math.round(len / 2);
  return [{ start: start, end: start + len }];
}
function fmtH(ms) { return (ms / HOUR).toFixed(2); }
function fmtHMS(ms) {
  ms = Math.max(0, ms);
  var s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  return h + ':' + String(m).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
}
function fmtT(t) {
  return t == null ? '—' : new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}
function fmtD(t) {
  return new Date(t).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
}
function fmtDT(t) { return t == null ? '—' : fmtD(t) + ' ' + fmtT(t); }
// The UI attributes a shift to a day in the viewer's local time, so the CSV
// date column must too - toISOString() would push an evening shift onto the
// next day's payroll. The raw epoch columns stay exact for reconciliation.
function localDateKey(t) {
  var d = new Date(t), p = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function toLocalInput(t) {
  if (t == null) return '';
  var d = new Date(t - new Date(t).getTimezoneOffset() * 60000);
  return d.toISOString().slice(0, 16);
}
function fromLocalInput(v) { return v ? new Date(v).getTime() : null; }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

/* ---------------- seed data (all demo) ---------------- */
var idSeq = 0;
function nid(p) { return p + '_' + Date.now().toString(36) + '_' + (idSeq++); }
function buildSeed() {
  idSeq = 0;
  var employees = [
    { id: 'emp_mike', name: 'Mike Torres',    role: 'Foreman' },
    { id: 'emp_dana', name: 'Dana Whitfield', role: 'Carpenter' },
    { id: 'emp_luis', name: 'Luis Ortega',    role: 'Laborer' },
    { id: 'emp_sam',  name: 'Sam Pruitt',     role: 'Electrician' }
  ];
  var managers = [
    { id: 'mgr_pat',  name: 'Pat Rivera',   title: 'Project Manager' },
    { id: 'mgr_owner', name: 'J. Whitcomb', title: 'Owner' }
  ];
  // All seeded jobs are explicit demos; real projects must come from a workspace data source.
  var jobs = [
    { id: 'job_training',name: 'Training Project (demo)',          seeded: true },
    { id: 'job_maple',   name: 'Maple Street Remodel (demo)',     seeded: true },
    { id: 'job_shop',    name: 'Shop / Warehouse (demo)',         seeded: true }
  ];
  var now = Date.now();
  var wk0 = mondayOf(now);         // this week's Monday 00:00
  var wk1 = wk0 - 7 * DAY;         // last week's Monday
  var entries = [];
  function mk(empId, jobId, weekStart, dayIdx, inH, outH, brkMin, status) {
    var cin = weekStart + dayIdx * DAY + Math.round(inH * HOUR);
    var cout = weekStart + dayIdx * DAY + Math.round(outH * HOUR); // outH may be >24 => crosses midnight
    var e = { id: nid('ent'), empId: empId, jobId: jobId, clockIn: cin, clockOut: cout,
              breaks: materializeBreak(cin, cout, brkMin), status: status || 'pending',
              edits: [], seeded: true };
    entries.push(e); return e;
  }
  // --- last week (complete) ---
  // Mike: 6 days x 9.5h paid (6:30-16:30, 30 min break) = 57h -> weekly OT + daily flags
  for (var d = 0; d < 6; d++) mk('emp_mike', d < 4 ? 'job_vanhorn' : 'job_maple', wk1, d, 6.5, 16.5, 30, d < 3 ? 'approved' : 'pending');
  // Dana: 5 days x 8.0h (7:00-15:30, 30 min break) = 40.00h -> boundary, no OT (rule is >40)
  for (d = 0; d < 5; d++) mk('emp_dana', 'job_vanhorn', wk1, d, 7, 15.5, 30, d < 3 ? 'approved' : 'pending');
  // Luis: Mon-Wed 8h on shop, Thu night pour 21:00->01:30 (+1 day, 4.5h), Fri 10.5h (daily flag).
  // Luis's Saturday is deliberately left empty - the seeded PENDING request fills it.
  for (d = 0; d < 3; d++) mk('emp_luis', 'job_shop', wk1, d, 7, 15.5, 30, 'approved');
  mk('emp_luis', 'job_vanhorn', wk1, 3, 21, 25.5, 0, 'pending');       // 21:00 Thu -> 01:30 Fri
  mk('emp_luis', 'job_vanhorn', wk1, 4, 6, 17, 30, 'pending');         // 10.5h paid
  // Sam: Mon-Thu 8h
  for (d = 0; d < 4; d++) mk('emp_sam', 'job_maple', wk1, d, 7, 15.5, 30, 'approved');
  // Sam's Saturday half-day: he forgot to clock out, filed a correction request, and the PM
  // approved it. The entry therefore carries an audit edit that cites the request id.
  var fixed = mk('emp_sam', 'job_maple', wk1, 5, 8, 12, 0, 'approved');
  var reqSamId = 'req_demo_sam';
  var decidedAt = wk1 + 6 * DAY + 9 * HOUR;
  fixed.edits.push({
    at: decidedAt, by: 'Pat Rivera (Project Manager)', requestId: reqSamId,
    changes: { clockOut: { from: wk1 + 5 * DAY + 11.5 * HOUR, to: fixed.clockOut } },
    note: 'Applied correction request R-1001 - employee reason: "Forgot to clock out, left site at noon after the panel swap."'
  });
  // --- this week (partial: full days before today) ---
  var todayIdx = Math.floor((dayStart(now) - wk0) / DAY);
  for (d = 0; d < Math.min(todayIdx, 5); d++) {
    mk('emp_mike', 'job_vanhorn', wk0, d, 6.5, 16.5, 30, 'pending');
    mk('emp_dana', 'job_vanhorn', wk0, d, 7, 15.5, 30, 'pending');
    mk('emp_luis', 'job_maple',   wk0, d, 7, 15.5, 30, 'pending');
  }
  // Mike is on the clock right now (started ~3h12m ago, took a 30-min break that ended)
  var cin = now - Math.round(3.2 * HOUR);
  entries.push({ id: nid('ent'), empId: 'emp_mike', jobId: 'job_vanhorn', clockIn: cin, clockOut: null,
    breaks: [{ start: cin + HOUR, end: cin + HOUR + 30 * 60000 }], status: 'open', edits: [], seeded: true });
  // Sam left a shift open ~26h ago -> stale, must be flagged, not silently counted
  entries.push({ id: nid('ent'), empId: 'emp_sam', jobId: 'job_shop', clockIn: now - 26 * HOUR, clockOut: null,
    breaks: [], status: 'open', edits: [], seeded: true });

  // --- demo requests: one already approved (above), one still pending ---
  var requests = [
    { id: reqSamId, ref: 'R-1001', type: 'correction', empId: 'emp_sam', jobId: 'job_maple',
      entryId: fixed.id, proposedIn: fixed.clockIn, proposedOut: fixed.clockOut, proposedBreakMin: 0,
      reason: 'Forgot to clock out, left site at noon after the panel swap.',
      submittedAt: wk1 + 5 * DAY + 19 * HOUR, status: 'approved',
      decidedAt: decidedAt, decidedBy: 'Pat Rivera (Project Manager)',
      decisionNote: 'Confirmed against the site log.', appliedEntryId: fixed.id, seeded: true },
    { id: 'req_demo_luis', ref: 'R-1002', type: 'missing', empId: 'emp_luis', jobId: 'job_vanhorn',
      entryId: null, proposedIn: wk1 + 5 * DAY + 8 * HOUR, proposedOut: wk1 + 5 * DAY + 12.5 * HOUR,
      proposedBreakMin: 0,
      reason: 'Called in Saturday to backfill the trench; tablet was dead so I never clocked in.',
      submittedAt: wk1 + 5 * DAY + 17 * HOUR, status: 'pending',
      decidedAt: null, decidedBy: null, decisionNote: '', appliedEntryId: null, seeded: true }
  ];
  return { employees: employees, managers: managers, jobs: jobs, entries: entries, requests: requests };
}

/* ---------------- app state ---------------- */
/* session = { role:'employer'|'employee', userId, name, title } */
var state = { session: null, weekOffset: 0, pick: { role: 'employee', empId: null, mgrId: null } };

function employees() { return Store.listEmployees(); }
function managers() { return Store.listManagers(); }
function jobs() { return Store.listJobs(); }
function entries() { return Store.listEntries(); }
function requests() { return Store.listRequests(); }
function empById(id) { var a = employees(); for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i]; return null; }
function jobById(id) { var a = jobs(); for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i]; return null; }
function entryById(id) { var a = entries(); for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i]; return null; }
function reqById(id) { var a = requests(); for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i]; return null; }
function jobName(id) { var j = jobById(id); return j ? j.name : String(id); }
function empName(id) { var e = empById(id); return e ? e.name : String(id); }
function isEmployer() { return !!state.session && state.session.role === 'employer'; }
function isEmployee() { return !!state.session && state.session.role === 'employee'; }
function myId() { return state.session ? state.session.userId : null; }
function actorLabel() { return state.session ? state.session.name + ' (' + state.session.title + ')' : 'unknown'; }

function openEntryFor(empId) {
  var a = entries();
  for (var i = 0; i < a.length; i++) if (a[i].empId === empId && a[i].clockOut == null) return a[i];
  return null;
}
function weekRange(offset) {
  var start = addDays(mondayOf(Date.now()), offset * 7);
  return { start: start, end: addDays(start, 7) };
}
function entriesInWeek(offset) {
  var r = weekRange(offset);
  return entries().filter(function (e) { return e.clockIn >= r.start && e.clockIn < r.end; });
}
/* countable = closed entries + fresh open entries (live). Stale open shifts are
   excluded from totals and surfaced as flags instead. Rejected entries excluded. */
function countable(e, now) { return e.status !== 'rejected' && !isStale(e, now); }
function pendingRequests() { return requests().filter(function (r) { return r.status === 'pending'; }); }
function myRequests() {
  var me = myId();
  return requests().filter(function (r) { return r.empId === me; })
    .sort(function (a, b) { return b.submittedAt - a.submittedAt; });
}

/* ---------------- toast ---------------- */
var toastTimer = null;
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
}
function alertInto(id, kind, msg) {
  var el = document.getElementById(id);
  if (el) el.innerHTML = msg ? '<div class="alert ' + kind + '">' + msg + '</div>' : '';
}

/* =====================================================================
   VALIDATION - shared by the employee's submit and the employer's approve.
   Approving re-runs it, so a request that went stale cannot be applied.
   ===================================================================== */
function findOverlap(empId, inMs, outMs, excludeEntryId) {
  var now = Date.now(), a = entries();
  for (var i = 0; i < a.length; i++) {
    var e = a[i];
    if (e.empId !== empId) continue;
    if (excludeEntryId && e.id === excludeEntryId) continue;
    if (e.status === 'rejected') continue;
    var s = e.clockIn;
    var en = e.clockOut == null ? Math.max(now, e.clockIn) : e.clockOut;
    if (inMs < en && s < outMs) return e;   // half-open intervals: touching is fine
  }
  return null;
}
/* returns null when valid, otherwise an HTML message saying what is wrong AND how to fix it */
function validateProposal(p) {
  var now = Date.now();
  if (!p.jobId) return 'Pick the job this shift was worked on — hours have to be attributed to a job.';
  if (p.clockIn == null || p.clockOut == null)
    return 'Enter <b>both</b> a clock-in and a clock-out time. Use the date pickers; a request with only one end cannot be costed.';
  if (p.clockOut <= p.clockIn)
    return 'Clock-out (<b>' + esc(fmtDT(p.clockOut)) + '</b>) is not after clock-in (<b>' + esc(fmtDT(p.clockIn)) +
           '</b>), so the shift would be zero or negative length. Fix: if the shift ran past midnight, set the clock-out to the <b>next day’s date</b>; otherwise correct whichever end is wrong.';
  if (p.clockIn > now + 60000 || p.clockOut > now + 60000)
    return 'Those times are in the future. You can only request hours you have already worked — set both ends to times on or before ' +
           esc(fmtDT(now)) + '.';
  if (!(p.breakMin >= 0))
    return 'Break minutes must be 0 or more. Enter <b>0</b> if you took no unpaid break.';
  if (p.breakMin * 60000 >= p.clockOut - p.clockIn)
    return 'The unpaid break (<b>' + p.breakMin + ' min</b>) is as long as or longer than the shift itself (' +
           fmtH(p.clockOut - p.clockIn) + ' h), which would leave no paid time. Fix: shorten the break, or widen the clock-in/clock-out window.';
  if (!p.reason || !p.reason.trim())
    return 'Add a reason. The project manager approves or denies from this text, so say what happened (for example “forgot to clock out”).';
  var clash = findOverlap(p.empId, p.clockIn, p.clockOut, p.excludeEntryId);
  if (clash) {
    return 'These times overlap an entry that already exists for ' + esc(empName(p.empId)) + ': <b>' +
      esc(fmtD(clash.clockIn)) + ' ' + esc(fmtT(clash.clockIn)) + ' → ' + esc(fmtT(clash.clockOut)) +
      '</b> on ' + esc(jobName(clash.jobId)) +
      '. Fix: move this request outside that window, or file a <b>correction</b> on that entry instead of adding a second shift.';
  }
  return null;
}

function wireSignIn() {
  var pick = document.querySelector('.rolepick');
  pick.addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-role]');
    if (!b) return;
    state.pick.role = b.dataset.role;
    renderApp();
  });
  document.getElementById('pick-user').addEventListener('change', function (ev) {
    if (state.pick.role === 'employer') state.pick.mgrId = ev.target.value;
    else state.pick.empId = ev.target.value;
  });
  document.getElementById('btn-signin').addEventListener('click', function () {
    var v = document.getElementById('pick-user').value;
    if (state.pick.role === 'employer') {
      var m = managers().filter(function (x) { return x.id === v; })[0];
      if (!m) return;
      state.session = { role: 'employer', userId: m.id, name: m.name, title: m.title };
    } else {
      var e = employees().filter(function (x) { return x.id === v; })[0];
      if (!e) return;
      state.session = { role: 'employee', userId: e.id, name: e.name, title: e.role };
    }
    Store.setSession(state.session);
    state.weekOffset = 0;
    toast('Signed in as ' + state.session.name);
    renderApp();
  });
}
function signOut() {
  Store.clearSession();
  state.session = null;
  renderApp();
  toast('Signed out');
}

function renderClock() {
  var now = Date.now();
  var open = openEntryFor(myId());
  var stale = open && isStale(open, now);
  var statusEl = document.getElementById('clock-status');
  var sub = document.getElementById('clock-sub');
  var btnIn = document.getElementById('btn-in'), btnBreak = document.getElementById('btn-break'), btnOut = document.getElementById('btn-out');
  var selJ = document.getElementById('sel-job');

  if (!open) {
    statusEl.innerHTML = '<span class="statuschip chip-off">Off the clock</span>';
    sub.textContent = 'Pick a job and clock in.';
    btnIn.disabled = false; btnBreak.disabled = true; btnOut.disabled = true;
    btnBreak.textContent = 'Start break';
    selJ.disabled = false;
  } else if (stale) {
    statusEl.innerHTML = '<span class="statuschip chip-stale">Shift left open ' + fmtH(now - open.clockIn) + ' h ago — flagged</span>';
    sub.innerHTML = 'Open since <b>' + esc(fmtDT(open.clockIn)) + '</b> on ' + esc(jobName(open.jobId)) +
      '. This shift is <b>excluded from your totals</b> until you clock out or a manager corrects it.';
    btnIn.disabled = true; btnBreak.disabled = true; btnOut.disabled = false;
    selJ.disabled = true; selJ.value = open.jobId;
  } else {
    var br = onBreak(open);
    statusEl.innerHTML = br
      ? '<span class="statuschip chip-break">On unpaid break</span>'
      : '<span class="statuschip chip-on">On the clock</span>';
    sub.innerHTML = 'Since <b>' + esc(fmtT(open.clockIn)) + '</b> on ' + esc(jobName(open.jobId)) +
      (breakMs(open, now) > 0 ? ' · break so far ' + fmtH(breakMs(open, now)) + ' h' : '');
    btnIn.disabled = true; btnOut.disabled = false; btnBreak.disabled = false;
    btnBreak.textContent = br ? 'End break' : 'Start break';
    selJ.disabled = true; selJ.value = open.jobId;
  }
  tickElapsed();
}
function tickElapsed() {
  var el = document.getElementById('clock-elapsed');
  if (!el) return;
  var open = openEntryFor(myId());
  el.textContent = open ? fmtHMS(workedMs(open, Date.now())) : '0:00:00';
}
function renderMyTables() {
  var now = Date.now(), me = myId();
  var t0 = dayStart(now), wk = weekRange(0);
  var mine = entries().filter(function (e) { return e.empId === me; });
  var today = mine.filter(function (e) { return e.clockIn >= t0 && e.clockIn < t0 + DAY; });
  var week = mine.filter(function (e) { return e.clockIn >= wk.start && e.clockIn < wk.end; });

  var todayMs = 0, weekMs = 0;
  today.forEach(function (e) { if (countable(e, now)) todayMs += workedMs(e, now); });
  week.forEach(function (e) { if (countable(e, now)) weekMs += workedMs(e, now); });
  document.getElementById('me-today').textContent = fmtH(todayMs) + ' h';
  document.getElementById('me-week').textContent = fmtH(weekMs) + ' h';

  var flags = [];
  if (todayMs > DAILY_LONG_MS) flags.push('<span class="flag soft">&gt;8 h today (daily rule)</span>');
  if (weekMs > WEEKLY_OT_MS) flags.push('<span class="flag hard">OT &gt;40 h this week (weekly rule)</span>');
  var staleMine = mine.filter(function (e) { return isStale(e, now); });
  if (staleMine.length) flags.push('<span class="flag warn">' + staleMine.length + ' shift(s) left open — not counted, see your manager</span>');
  document.getElementById('me-flags').innerHTML = flags.join(' ') || '<span class="small muted">No overtime flags.</span>';

  document.getElementById('me-today-table').innerHTML = entryTable(today, now);
  document.getElementById('me-week-table').innerHTML = entryTable(week, now);
}
function entryTable(list, now) {
  if (!list.length) return '<p class="small muted">No entries.</p>';
  list = list.slice().sort(function (a, b) { return a.clockIn - b.clockIn; });
  var rows = list.map(function (e) {
    var stale = isStale(e, now);
    var w = workedMs(e, now);
    var flags = [];
    if (e.seeded) flags.push('<span class="flag demo">demo</span>');
    if (stale) flags.push('<span class="flag hard">left open — flagged, not counted</span>');
    else if (e.clockOut != null && dayStart(e.clockOut) !== dayStart(e.clockIn)) flags.push('<span class="flag warn">crosses midnight</span>');
    if (!stale && w > DAILY_LONG_MS) flags.push('<span class="flag soft">&gt;8 h/day</span>');
    if (e.edits && e.edits.length) flags.push('<span class="flag warn">edited by manager</span>');
    var st = e.clockOut == null ? (stale ? 'stale' : 'open') : e.status;
    var stChip = { approved: 'ok', rejected: 'hard', pending: 'warn', open: 'ok', stale: 'hard' }[st] || 'warn';
    return '<tr>' +
      '<td>' + esc(fmtD(e.clockIn)) + '</td>' +
      '<td>' + esc(jobName(e.jobId)) + '</td>' +
      '<td>' + esc(fmtT(e.clockIn)) + '</td>' +
      '<td>' + esc(fmtT(e.clockOut)) + (e.clockOut != null && dayStart(e.clockOut) !== dayStart(e.clockIn) ? ' <span class="small muted">(+1d)</span>' : '') + '</td>' +
      '<td class="num">' + fmtH(breakMs(e, now)) + '</td>' +
      '<td class="num"><b>' + (stale ? '—' : fmtH(w)) + '</b></td>' +
      '<td><span class="flag ' + stChip + '">' + st + '</span> ' + flags.join(' ') + '</td>' +
      '</tr>';
  }).join('');
  var total = 0; list.forEach(function (e) { if (countable(e, now)) total += workedMs(e, now); });
  return '<table><thead><tr><th>Date</th><th>Job</th><th>In</th><th>Out</th><th class="num">Break h</th><th class="num">Paid h</th><th>Status / flags</th></tr></thead>' +
    '<tbody>' + rows + '<tr class="totalrow"><td colspan="5">Total (counted)</td><td class="num">' + fmtH(total) + '</td><td></td></tr></tbody></table>';
}

/* ---- employee clock actions ---- */
function doClockIn() {
  empError('');
  var open = openEntryFor(myId());
  if (open) { empError('Already clocked in (since ' + esc(fmtDT(open.clockIn)) + '). Clock out first.'); return; }
  var jobId = document.getElementById('sel-job').value;
  if (!jobId) { empError('Pick a job first.'); return; }
  Store.saveEntry({ id: nid('ent'), empId: myId(), jobId: jobId, clockIn: Date.now(), clockOut: null,
                    breaks: [], status: 'open', edits: [], seeded: false });
  toast('Clocked in');
  refresh();
}
function doClockOut() {
  empError('');
  var open = openEntryFor(myId());
  if (!open) { empError('Not clocked in — nothing to clock out of.'); return; }
  var now = Date.now();
  var patch = { clockOut: now, status: 'pending' };
  if (onBreak(open)) { // auto-end a running break at clock-out
    var brs = open.breaks.slice(); brs[brs.length - 1] = { start: brs[brs.length - 1].start, end: now };
    patch.breaks = brs;
  }
  Store.updateEntry(open.id, patch);
  var merged = { clockIn: open.clockIn, clockOut: patch.clockOut, breaks: patch.breaks || open.breaks };
  toast('Clocked out — ' + fmtH(workedMs(merged, now)) + ' h recorded (pending approval)');
  refresh();
}
function doBreakToggle() {
  empError('');
  var open = openEntryFor(myId());
  if (!open) { empError('Not clocked in.'); return; }
  if (isStale(open, Date.now())) { empError('This shift is flagged as left open. Clock out, or request a correction below.'); return; }
  var brs = (open.breaks || []).slice();
  if (onBreak(open)) {
    brs[brs.length - 1] = { start: brs[brs.length - 1].start, end: Date.now() };
    toast('Break ended');
  } else {
    brs.push({ start: Date.now(), end: null });
    toast('Break started (unpaid)');
  }
  Store.updateEntry(open.id, { breaks: brs });
  refresh();
}

/* ---- employee: request hours ---- */
function correctableEntries() {
  var now = Date.now(), cutoff = now - REQ_WINDOW_DAYS * DAY;
  return entries().filter(function (e) {
    return e.empId === myId() && e.clockIn >= cutoff && e.status !== 'rejected';
  }).sort(function (a, b) { return b.clockIn - a.clockIn; });
}
function renderRequestForm(keepValues) {

function prefillFromEntry() {

  document.getElementById('req-in').value = toLocalInput(e.clockIn);

}
function submitRequest() {
  alertInto('req-error', 'bad', '');
  var type = document.getElementById('req-type').value;
  var entryId = type === 'correction' ? document.getElementById('req-entry').value : null;
  var p = {
    empId: myId(),
    jobId: document.getElementById('req-job').value,
    clockIn: fromLocalInput(document.getElementById('req-in').value),
    clockOut: fromLocalInput(document.getElementById('req-out').value),
    breakMin: Math.round(Number(document.getElementById('req-break').value) || 0),
    reason: document.getElementById('req-reason').value,
    excludeEntryId: entryId
  };
  if (type === 'correction' && !entryId) {
    alertInto('req-error', 'bad', 'Pick the entry you want corrected. If the shift was never clocked in at all, ' +
      'switch the request type to <b>Add a missing shift</b>.');
    return;
  }
  if (type === 'correction' && !entryById(entryId)) {
    alertInto('req-error', 'bad', 'That entry no longer exists. Reload and pick again.');
    return;
  }
  var err = validateProposal(p);
  if (err) { alertInto('req-error', 'bad', err); return; }

  var all = requests();
  var r = {
    id: nid('req'), ref: 'R-' + (1001 + all.length), type: type,
    empId: p.empId, jobId: p.jobId, entryId: entryId,
    proposedIn: p.clockIn, proposedOut: p.clockOut, proposedBreakMin: p.breakMin,
    reason: p.reason.trim(), submittedAt: Date.now(), status: 'pending',
    decidedAt: null, decidedBy: null, decisionNote: '', appliedEntryId: null, seeded: false
  };
  Store.saveRequest(r);
  document.getElementById('req-reason').value = '';
  alertInto('req-error', 'ok', 'Request <b>' + esc(r.ref) + '</b> submitted for ' +
    fmtH(r.proposedOut - r.proposedIn - r.proposedBreakMin * 60000) + ' h. ' +
    'It is <b>pending</b> until a manager approves it — your hours have not changed yet.');
  toast('Request ' + r.ref + ' submitted');
  refresh();
}
function withdrawRequest(id) {
  var r = reqById(id);
  if (!r || r.empId !== myId() || r.status !== 'pending') return;
  Store.updateRequest(id, { status: 'withdrawn', decidedAt: Date.now(), decidedBy: state.session.name + ' (withdrew)' });
  toast('Request ' + r.ref + ' withdrawn');
  refresh();
}
function proposalSummary(r) {
  var worked = Math.max(0, r.proposedOut - r.proposedIn - r.proposedBreakMin * 60000);
  return '<div class="rgrid">' +
    '<div><div class="rk">Job</div>' + esc(jobName(r.jobId)) + '</div>' +
    '<div><div class="rk">Proposed clock in</div>' + esc(fmtDT(r.proposedIn)) + '</div>' +
    '<div><div class="rk">Proposed clock out</div>' + esc(fmtDT(r.proposedOut)) +
      (dayStart(r.proposedOut) !== dayStart(r.proposedIn) ? ' <span class="small muted">(+1d)</span>' : '') + '</div>' +
    '<div><div class="rk">Unpaid break</div>' + r.proposedBreakMin + ' min</div>' +
    '<div><div class="rk">Paid hours if approved</div><b>' + fmtH(worked) + ' h</b></div>' +
    '<div><div class="rk">Submitted</div>' + esc(fmtDT(r.submittedAt)) + '</div>' +
  '</div>';
}
function requestDelta(r) {
  if (r.type !== 'correction') return '';
  var e = entryById(r.entryId);
  if (!e) return '<div class="small delta">Target entry no longer exists.</div>';
  var now = Date.now();
  var oldBrk = Math.round(breakMs(e, e.clockOut == null ? now : e.clockOut) / 60000);
  var parts = [];
  if (e.clockIn !== r.proposedIn) parts.push('in: <del>' + esc(fmtDT(e.clockIn)) + '</del> → <ins>' + esc(fmtDT(r.proposedIn)) + '</ins>');
  if (e.clockOut !== r.proposedOut) parts.push('out: <del>' + esc(fmtDT(e.clockOut)) + '</del> → <ins>' + esc(fmtDT(r.proposedOut)) + '</ins>');
  if (oldBrk !== r.proposedBreakMin) parts.push('break: <del>' + oldBrk + ' min</del> → <ins>' + r.proposedBreakMin + ' min</ins>');
  if (e.jobId !== r.jobId) parts.push('job: <del>' + esc(jobName(e.jobId)) + '</del> → <ins>' + esc(jobName(r.jobId)) + '</ins>');
  var cur = workedMs(e, now), next = Math.max(0, r.proposedOut - r.proposedIn - r.proposedBreakMin * 60000);
  parts.push('paid: <del>' + fmtH(cur) + ' h</del> → <ins>' + fmtH(next) + ' h</ins>');
  return '<div class="small delta" style="margin-top:8px"><b>Change to entry:</b> ' + parts.join(' &middot; ') + '</div>';
}
function statusFlag(r) {
  var cls = { pending: 'warn', approved: 'ok', denied: 'hard', withdrawn: 'info' }[r.status] || 'info';
  return '<span class="flag ' + cls + '">' + r.status + '</span>';
}

  }).join('') : '<p class="small muted">You have not sent any requests.</p>';

function renderRoster() {

    var open = openEntryFor(emp.id);

      '<td>' + esc(fmtT(e.clockOut)) + (e.clockOut != null && dayStart(e.clockOut) !== dayStart(e.clockIn) ? ' <span class="small muted">(+1d)</span>' : '') + '</td>' +
      '<td class="num">' + fmtH(breakMs(e, now)) + '</td>' +
      '<td class="num" data-paid="' + esc(e.id) + '"><b>' + (stale ? '—' : fmtH(workedMs(e, now))) + '</b></td>' +
      '<td><span class="flag ' + stChip + '">' + st + '</span>' +
        (stale ? ' <span class="flag hard">left open &gt;16 h</span>' : '') +
        (e.seeded ? ' <span class="flag demo">demo</span>' : '') +
        (e.edits && e.edits.length ? ' <span class="flag warn">edited</span>' : '') +
        auditHtml(e, 'Audit trail:') + '</td>' +
      '<td style="white-space:nowrap">' +
        (canJudge && st !== 'approved' ? '<button class="btn small" data-act="approve" data-id="' + esc(e.id) + '" type="button">Approve</button> ' : '') +
        (canJudge && st !== 'rejected' ? '<button class="btn small ghost" data-act="reject" data-id="' + esc(e.id) + '" type="button">Reject</button> ' : '') +
        '<button class="btn small secondary" data-act="edit" data-id="' + esc(e.id) + '" type="button">Edit</button>' +
      '</td></tr>';
  });
  html += '</tbody></table>';
  document.getElementById('pm-entries').innerHTML = html;
}

function renderReqQueue() {
  var pend = pendingRequests().sort(function (a, b) { return a.submittedAt - b.submittedAt; });
  var cnt = document.getElementById('req-count');
  cnt.textContent = pend.length + ' pending';
  cnt.className = 'count' + (pend.length ? '' : ' zero');
  document.getElementById('req-queue').innerHTML = pend.length ? pend.map(function (r) {
    return '<div class="reqcard pending" data-req="' + esc(r.id) + '">' +
      '<div class="rhead"><span class="rref">' + esc(r.ref) + ' · ' + esc(empName(r.empId)) + ' · ' +
        (r.type === 'correction' ? 'Correction' : 'Missing shift') + '</span>' +
        '<span>' + statusFlag(r) + (r.seeded ? ' <span class="flag demo">demo</span>' : '') + '</span></div>' +
      proposalSummary(r) + requestDelta(r) +
      '<div class="reason"><b>Employee reason:</b> ' + esc(r.reason) + '</div>' +
      '<div id="req-err-' + esc(r.id) + '"></div>' +
      '<div class="reqactions">' +
        '<input type="text" id="req-note-' + esc(r.id) + '" placeholder="Note (optional) — shown to the employee">' +
        '<button class="btn small" data-ract="approve" data-id="' + esc(r.id) + '" type="button">Approve &amp; apply</button>' +
        '<button class="btn small ghost" data-ract="deny" data-id="' + esc(r.id) + '" type="button">Deny</button>' +
      '</div>' +
    '</div>';
  }).join('') : '<p class="small muted">No pending requests.</p>';

  var done = requests().filter(function (r) { return r.status !== 'pending'; })
    .sort(function (a, b) { return (b.decidedAt || 0) - (a.decidedAt || 0); });
  var doneCount = document.getElementById('req-done-count');
  doneCount.textContent = done.length;
  document.getElementById('req-history').innerHTML = done.length ? done.map(function (r) {
    return '<div class="reqcard ' + r.status + '">' +
      '<div class="rhead"><span class="rref">' + esc(r.ref) + ' · ' + esc(empName(r.empId)) + ' · ' +
        (r.type === 'correction' ? 'Correction' : 'Missing shift') + '</span>' +
        '<span>' + statusFlag(r) + (r.seeded ? ' <span class="flag demo">demo</span>' : '') + '</span></div>' +
      '<div class="small muted" style="margin-top:6px">' +
        esc(fmtDT(r.proposedIn)) + ' → ' + esc(fmtT(r.proposedOut)) + ' · ' + esc(jobName(r.jobId)) +
        ' · ' + fmtH(Math.max(0, r.proposedOut - r.proposedIn - r.proposedBreakMin * 60000)) + ' h' +
        (r.decidedBy ? ' · ' + (r.status === 'withdrawn' ? '' : r.status + ' by ') + esc(r.decidedBy) + ' on ' + esc(fmtDT(r.decidedAt)) : '') +
        (r.decisionNote ? ' · note: ' + esc(r.decisionNote) : '') +
        (r.status === 'approved' && r.appliedEntryId ? ' · applied to entry ' + esc(r.appliedEntryId) : '') +
        (r.status === 'denied' ? ' · no hours changed' : '') +
      '</div>' +
      '<div class="reason"><b>Reason:</b> ' + esc(r.reason) + '</div>' +
    '</div>';
  }).join('') : '<p class="small muted">Nothing decided yet.</p>';
}

/* ---- employer: approve / deny a request ---- */
function approveRequest(id) {
  if (!isEmployer()) return;                        // belt and braces; the button only exists for employers
  var r = reqById(id);
  if (!r || r.status !== 'pending') return;
  var noteEl = document.getElementById('req-note-' + id);
  var note = noteEl ? noteEl.value.trim() : '';
  var at = Date.now(), by = actorLabel();

  if (r.type === 'correction' && !entryById(r.entryId)) {
    alertInto('req-err-' + id, 'bad', 'The entry this request points at no longer exists, so there is nothing to amend. Deny it and ask for a missing-shift request instead.');
    return;
  }
  // re-validate at apply time: the timesheet may have moved since submission
  var err = validateProposal({
    empId: r.empId, jobId: r.jobId, clockIn: r.proposedIn, clockOut: r.proposedOut,
    breakMin: r.proposedBreakMin, reason: r.reason, excludeEntryId: r.entryId
  });
  if (err) { alertInto('req-err-' + id, 'bad', '<b>Cannot apply this request.</b> ' + err); return; }

  var brs = materializeBreak(r.proposedIn, r.proposedOut, r.proposedBreakMin);
  var appliedId;
  if (r.type === 'missing') {
    var ne = {
      id: nid('ent'), empId: r.empId, jobId: r.jobId,
      clockIn: r.proposedIn, clockOut: r.proposedOut, breaks: brs, status: 'approved',
      edits: [{
        at: at, by: by, requestId: r.id,
        changes: {
          clockIn: { from: null, to: r.proposedIn },
          clockOut: { from: null, to: r.proposedOut },
          breakMinutes: { from: 0, to: r.proposedBreakMin }
        },
        note: 'Entry created by approving missing-shift request ' + r.ref +
              ' from ' + empName(r.empId) + (note ? ' — ' + note : '') +
              ' (employee reason: "' + r.reason + '")'
      }],
      seeded: false, fromRequestId: r.id
    };
    Store.saveEntry(ne);
    appliedId = ne.id;
  } else {
    var e = entryById(r.entryId);
    var oldBrk = Math.round(breakMs(e, e.clockOut == null ? at : e.clockOut) / 60000);
    var changes = {};
    if (e.clockIn !== r.proposedIn) changes.clockIn = { from: e.clockIn, to: r.proposedIn };
    if (e.clockOut !== r.proposedOut) changes.clockOut = { from: e.clockOut, to: r.proposedOut };
    if (oldBrk !== r.proposedBreakMin) changes.breakMinutes = { from: oldBrk, to: r.proposedBreakMin };
    if (e.jobId !== r.jobId) changes.job = { from: jobName(e.jobId), to: jobName(r.jobId) };
    if (!Object.keys(changes).length) changes.clockOut = { from: e.clockOut, to: r.proposedOut }; // no-op request: still record the review
    Store.updateEntry(e.id, {
      clockIn: r.proposedIn, clockOut: r.proposedOut, breaks: brs, jobId: r.jobId, status: 'approved',
      edits: (e.edits || []).concat([{
        at: at, by: by, requestId: r.id, changes: changes,
        note: 'Applied correction request ' + r.ref + ' from ' + empName(r.empId) +
              (note ? ' — ' + note : '') + ' (employee reason: "' + r.reason + '")'
      }])
    });
    appliedId = e.id;
  }
  Store.updateRequest(r.id, { status: 'approved', decidedAt: at, decidedBy: by, decisionNote: note, appliedEntryId: appliedId });
  toast('Request ' + r.ref + ' approved and applied');
  refresh();
}
function denyRequest(id) {
  if (!isEmployer()) return;
  var r = reqById(id);
  if (!r || r.status !== 'pending') return;
  var noteEl = document.getElementById('req-note-' + id);
  Store.updateRequest(id, {
    status: 'denied', decidedAt: Date.now(), decidedBy: actorLabel(),
    decisionNote: noteEl ? noteEl.value.trim() : ''
  });
  toast('Request ' + r.ref + ' denied — no hours changed');
  refresh();
}

/* ---- employer: edit + judge entries ---- */
var editingId = null;
function openEdit(id) {
  var e = entryById(id);
  if (!e) return;
  editingId = id;
  document.getElementById('ed-in').value = toLocalInput(e.clockIn);
  document.getElementById('ed-out').value = toLocalInput(e.clockOut == null ? Date.now() : e.clockOut);
  document.getElementById('ed-break').value = Math.round(breakMs(e, e.clockOut == null ? Date.now() : e.clockOut) / 60000);
  document.getElementById('ed-by').value = actorLabel();
  document.getElementById('ed-error').innerHTML = '';
  document.getElementById('ed-audit').innerHTML =
    auditHtml(e, 'Previous edits (originals preserved):') || '<p class="small muted">No prior edits on this entry.</p>';
  document.getElementById('dlg-edit').showModal();
}
function saveEdit() {
  var e = entryById(editingId);
  if (!e) return;
  var nIn = fromLocalInput(document.getElementById('ed-in').value);
  var nOut = fromLocalInput(document.getElementById('ed-out').value);
  var nBrk = Math.max(0, Math.round(Number(document.getElementById('ed-break').value) || 0));
  var by = document.getElementById('ed-by').value.trim() || actorLabel();
  if (nIn == null || nOut == null) { alertInto('ed-error', 'bad', 'Both clock in and clock out are required.'); return; }
  if (nOut <= nIn) { alertInto('ed-error', 'bad', 'Clock out must be after clock in (shifts crossing midnight: use the next day’s date).'); return; }
  if (nBrk * 60000 >= nOut - nIn) { alertInto('ed-error', 'bad', 'Break cannot be as long as the whole shift.'); return; }
  var clash = findOverlap(e.empId, nIn, nOut, e.id);
  if (clash) {
    alertInto('ed-error', 'bad', 'These times overlap another entry for ' + esc(empName(e.empId)) + ' (<b>' +
      esc(fmtD(clash.clockIn)) + ' ' + esc(fmtT(clash.clockIn)) + ' → ' + esc(fmtT(clash.clockOut)) +
      '</b>). Adjust the times, or edit that entry instead.');
    return;
  }
  var oldBrk = Math.round(breakMs(e, e.clockOut == null ? Date.now() : e.clockOut) / 60000);
  var changes = {};
  if (nIn !== e.clockIn) changes.clockIn = { from: e.clockIn, to: nIn };
  if (nOut !== e.clockOut) changes.clockOut = { from: e.clockOut, to: nOut };
  if (nBrk !== oldBrk) changes.breakMinutes = { from: oldBrk, to: nBrk };
  if (!Object.keys(changes).length) { document.getElementById('dlg-edit').close(); return; }
  Store.updateEntry(e.id, {
    clockIn: nIn, clockOut: nOut, breaks: materializeBreak(nIn, nOut, nBrk),
    edits: (e.edits || []).concat([{ at: Date.now(), by: by, changes: changes }]),
    status: e.status === 'open' ? 'pending' : e.status
  });
  document.getElementById('dlg-edit').close();
  toast('Entry edited — audit trail updated');
  refresh();
}
function judge(id, status) {
  if (!isEmployer()) return;
  Store.updateEntry(id, { status: status });
  toast('Entry ' + status);
  refresh();
}

/* ---------------- CSV export (employer only) ---------------- */
function csvEscape(v) {
  v = String(v == null ? '' : v);
  return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
function buildCsv() {
  var now = Date.now();
  var r = weekRange(state.weekOffset);
  var list = entriesInWeek(state.weekOffset).slice().sort(function (a, b) { return a.clockIn - b.clockIn; });
  var head = ['entry_id', 'employee', 'role', 'job', 'date', 'clock_in_iso', 'clock_out_iso',
    'clock_in_ms', 'clock_out_ms', 'break_ms', 'worked_ms', 'worked_hours_precise', 'status',
    'stale_open', 'crosses_midnight', 'edited', 'from_request', 'seeded_demo'];
  var rows = [head.join(',')];
  list.forEach(function (e) {
    var emp = empById(e.empId), job = jobById(e.jobId);
    var stale = isStale(e, now);
    var w = workedMs(e, now);
    rows.push([
      e.id, emp ? emp.name : e.empId, emp ? emp.role : '', job ? job.name : e.jobId,
      localDateKey(e.clockIn),
      new Date(e.clockIn).toISOString(),
      e.clockOut == null ? '' : new Date(e.clockOut).toISOString(),
      e.clockIn, e.clockOut == null ? '' : e.clockOut,
      breakMs(e, now), stale ? '' : w,
      stale ? '' : (w / HOUR),                       // full precision, not rounded
      e.clockOut == null ? (stale ? 'stale-open' : 'open') : e.status,
      stale ? 'yes' : '',
      e.clockOut != null && dayStart(e.clockOut) !== dayStart(e.clockIn) ? 'yes' : '',
      e.edits && e.edits.length ? 'yes' : '',
      e.fromRequestId ? refOf(e.fromRequestId) : '',
      e.seeded ? 'yes' : ''
    ].map(csvEscape).join(','));
  });
  return { name: 'timesheet-week-' + localDateKey(r.start) + '.csv', text: rows.join('\n') };
}
async function exportCsv() {
  var c = buildCsv();
  // In the published artifact, saves go through the downloads capability -
  // the viewer confirms and the file lands for real. Script-driven anchor
  // downloads are inert there, so they are only the non-artifact fallback.
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      var dl = await window.claude.use('downloads');
      if (dl) {
        try {
          await dl.save({ filename: c.name, data: c.text });
          return;
        } catch (err) {
          if (err && err.code === 'declined') return;
          if (err && err.code === 'extension_not_enabled') {
            try { await dl.save({ filename: c.name.replace(/\.csv$/, '.csv.txt'), data: c.text }); return; }
            catch (e2) { if (e2 && e2.code === 'declined') return; }
          }
        }
      }
    } else {
      var blob = new Blob([c.text], { type: 'text/csv' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = c.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
    }
  } catch (err) { /* fall through to the copy dialog */ }
  document.getElementById('csv-text').value = c.text;
  document.getElementById('dlg-csv').showModal();
}

/* =====================================================================
   RENDER ROOT
   ===================================================================== */
function renderChrome() {
  var s = state.session;
  document.getElementById('sessionbar').innerHTML = s
    ? '<div class="sessionbar"><div class="who">' +
        '<span class="rolechip ' + s.role + '">' + (s.role === 'employer' ? 'Employer portal' : 'Employee portal') + '</span>' +
        '<span class="nm">' + esc(s.name) + '</span><span>' + esc(s.title) + '</span>' +
        '<span class="small">demo sign-in — no password, no server</span>' +
      '</div>' +
      '<button class="btn small ghost" id="btn-signout" type="button" style="color:#cfe0ff;border-color:rgba(255,255,255,.35)">Sign out</button></div>'
    : '';
  if (s) document.getElementById('btn-signout').addEventListener('click', signOut);

  document.getElementById('banner').innerHTML =
    '<div class="demo-banner">' +
      '<span>⚠ Seeded demo data — every employee, job, time entry and request on this page was generated for this demo. Not real payroll records.</span>' +
      (isEmployer() ? '<span style="display:flex;gap:8px;align-items:center"><button class="btn small ghost" id="btn-reset" type="button">Reset demo data</button></span>' : '') +
    '</div>';
  if (isEmployer()) {
    document.getElementById('btn-reset').addEventListener('click', function () {
      Store.resetDemo(); state.weekOffset = 0; toast('Demo data reset'); refresh();
    });
  }

  document.getElementById('footnote').innerHTML = !s
    ? 'Employee Hub demo — data lives only in this browser (localStorage). The portal picker above is a demo affordance, not authentication.'
    : isEmployer()
      ? 'Employer portal — full timesheet powers. Data lives only in this browser (localStorage); there is no server, so this gate is a demo affordance, not real authorization. See the README in <code>web/employee-hub/</code>.'
      : 'Employee portal — clock in/out, breaks, and hours requests only. Other employees’ hours, the roster, approvals, edits and the export are not built into this page for your role. Client-side gating is a demo affordance; real enforcement needs a backend.';

  document.getElementById('storage-warning').innerHTML = Store.ok() ? '' :
    '<div class="alert warn"><b>Browser storage unavailable.</b> The demo still works, but changes are kept in memory only and vanish on reload.</div>';
}

function renderApp() {
  var app = document.getElementById('app');
  renderChrome();
  if (!state.session) { app.innerHTML = signInHtml(); wireSignIn(); return; }
  if (state.session.role === 'employer') { app.innerHTML = employerShellHtml(); wireEmployer(); }
  else { app.innerHTML = employeeShellHtml(); wireEmployee(); }
  refresh();
}

/* refresh = update the mounted portal's dynamic regions (never crosses roles) */
function refresh() {
  renderChrome();
  if (isEmployee()) {
    renderJobSelect(document.getElementById('sel-job'), true);
    renderClock();
    renderMyTables();
    renderRequestForm(true);
    renderMyRequests();
  } else if (isEmployer()) {
    renderRoster();
    renderWeekNav();
    renderMatrix();
    renderJobTotals();
    renderPmEntries();
    renderReqQueue();
  }
}

function wireEmployee() {
  document.getElementById('btn-in').addEventListener('click', doClockIn);
  document.getElementById('btn-out').addEventListener('click', doClockOut);
  document.getElementById('btn-break').addEventListener('click', doBreakToggle);
  document.getElementById('req-type').addEventListener('change', function () {
    renderRequestForm(false);
    if (document.getElementById('req-type').value === 'correction') prefillFromEntry();
  });
  document.getElementById('req-entry').addEventListener('change', prefillFromEntry);
  document.getElementById('btn-req-submit').addEventListener('click', submitRequest);
  document.getElementById('my-requests').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-act="withdraw"]');
    if (b) withdrawRequest(b.dataset.id);
  });
  // first paint of the request form, then seed sensible defaults
  renderRequestForm(false);
  if (correctableEntries().length) prefillFromEntry();
  else {
    document.getElementById('req-type').value = 'missing';
    renderRequestForm(false);
  }
}
function wireEmployer() {
  document.getElementById('wk-prev').addEventListener('click', function () { state.weekOffset--; refresh(); });
  document.getElementById('wk-next').addEventListener('click', function () { state.weekOffset++; refresh(); });
  document.getElementById('btn-csv').addEventListener('click', exportCsv);
  document.getElementById('pm-entries').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-act]');
    if (!b) return;
    if (b.dataset.act === 'approve') judge(b.dataset.id, 'approved');
    else if (b.dataset.act === 'reject') judge(b.dataset.id, 'rejected');
    else if (b.dataset.act === 'edit') openEdit(b.dataset.id);
  });
  document.getElementById('req-queue').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-ract]');
    if (!b) return;
    if (b.dataset.ract === 'approve') approveRequest(b.dataset.id);
    else if (b.dataset.ract === 'deny') denyRequest(b.dataset.id);
  });
  document.getElementById('ed-save').addEventListener('click', saveEdit);
  document.getElementById('ed-cancel').addEventListener('click', function () { document.getElementById('dlg-edit').close(); });
  document.getElementById('csv-close').addEventListener('click', function () { document.getElementById('dlg-csv').close(); });
  document.getElementById('csv-copy').addEventListener('click', function () {
    var ta = document.getElementById('csv-text'); ta.select();
    try { navigator.clipboard.writeText(ta.value); toast('CSV copied'); }
    catch (e) { try { document.execCommand('copy'); toast('CSV copied'); } catch (e2) { toast('Select the text and copy manually'); } }
  });
}

/* ---------------- boot ---------------- */
function init() {
  Store.seed(false);
  var s = Store.getSession();
  // a stored session is only honoured if the account still exists
  if (s && s.role === 'employee' && !empById(s.userId)) s = null;
  if (s && s.role === 'employer' && !managers().filter(function (m) { return m.id === s.userId; }).length) s = null;
  state.session = s || null;
  var emps = employees(), mgrs = managers();
  state.pick.empId = emps.length ? emps[0].id : null;
  state.pick.mgrId = mgrs.length ? mgrs[0].id : null;
  renderApp();
  // durations always derive from timestamps, so a backgrounded tab loses nothing;
  // this interval only refreshes what is displayed.
  setInterval(function () {
    if (isEmployee()) tickElapsed();
    else if (isEmployer()) renderRoster();
  }, 1000);
}
init();
</script>
