/* ================================================================
   PLAN-DRIVEN OPENING SCHEDULE (Phoenician)
   ----------------------------------------------------------------
   Phoenician uploads build plans — floor plans, as many as the job
   needs, no elevations. The engine reads the openings off them and
   this turns that reading into the quote: every window and door
   arrives with its size and count already filled in.

   The salesman is left with three decisions per line — style,
   material, quantity. Size comes from the drawing and price follows
   from it, because the Phoenician pricing sheet is per square foot:
   rate x (W x H / 144) x qty.
   ================================================================ */
const DOOR_H_DEFAULT = 80;   // leaf height when the plan gives width only
const GAR_H_DEFAULT  = 84;   // 7'-0" overhead door

/* ----------------------------------------------------------------
   DIMENSION PARSING
   Build plans write sizes a dozen different ways. This reads all of
   them into inches: feet-inches with or without a dash, fractional
   inches, bare inches, slash notation, four-digit door marks, decimal
   feet, and metric in mm, cm or m.
   ---------------------------------------------------------------- */
const MM_IN=25.4, CM_IN=2.54, M_IN=39.3701;
function fracVal(a,b){ return (+b) ? (+a)/(+b) : 0; }

/* One dimension token -> inches, or null when it isn't a dimension. */
function dimToInches(tok){
  if(tok==null) return null;
  let t=String(tok).trim().toLowerCase().replace(/[′’]/g,"'").replace(/[″”]/g,'"').replace(/[×]/g,"x").replace(/\s+/g," ");
  if(!t) return null;
  let m;
  /* metric */
  if((m=t.match(/^([\d.]+)\s*mm$/)))                    return +m[1]/MM_IN;
  if((m=t.match(/^([\d.]+)\s*cm$/)))                    return +m[1]/CM_IN;
  if((m=t.match(/^([\d.]+)\s*m$/)))                     return +m[1]*M_IN;
  /* feet + inches + optional fraction: 3'-6 1/2"  3' 6"  3'6  3 ft 6 in */
  if((m=t.match(/^(\d+(?:\.\d+)?)\s*(?:'|ft|feet|foot)\s*[-\s]?\s*(?:(\d+)\s*)?(?:(\d+)\s*\/\s*(\d+)\s*)?(?:"|in|inch|inches)?$/)))
    return (+m[1])*12 + (m[2]?+m[2]:0) + (m[3]?fracVal(m[3],m[4]):0);
  /* inches with a fraction: 36 1/2"  */
  if((m=t.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)\s*(?:"|in|inch|inches)?$/)))
    return (+m[1]) + fracVal(m[2],m[3]);
  /* plain inches: 36"  36 in */
  if((m=t.match(/^([\d.]+)\s*(?:"|in|inch|inches)$/)))  return +m[1];
  /* slash feet/inches: 3/0  2/8 */
  if((m=t.match(/^(\d{1,2})\s*\/\s*(\d{1,2})$/)) && +m[2]<12) return (+m[1])*12 + (+m[2]);
  /* feet-inches with a dash and no marks: 3-0  6-8 */
  if((m=t.match(/^(\d{1,2})\s*-\s*(\d{1,2})$/)) && +m[2]<12)  return (+m[1])*12 + (+m[2]);
  /* bare number — caller decides the unit */
  if((m=t.match(/^([\d.]+)$/)))                         return +m[1];
  return null;
}
/* A bare pair like 900 x 2100 is millimetres; 36 x 66 is inches. */
function bareUnitScale(a,b){ return (a>=250 && b>=250) ? 1/MM_IN : 1; }
/* Four-digit door/window mark: 3068 = 3'-0" x 6'-8" */
function markCode(t){
  const m=String(t).match(/(?:^|[^\d])(\d)(\d)(\d)(\d)(?:[^\d]|$)/);
  if(!m) return null;
  const wf=+m[1], wi=+m[2], hf=+m[3], hi=+m[4];
  if(wf<1||wf>9||hf<1||hf>9||wi>11||hi>11) return null;
  return { w:wf*12+wi, h:hf*12+hi };
}
/* Every dimension in a string, in order, normalised to inches. */
function dimTokens(s){
  const out=[];
  const re=/(\d+(?:\.\d+)?)\s*(?:'|ft|feet|foot)\s*[-\s]?\s*(?:(\d+)\s*)?(?:(\d+)\s*\/\s*(\d+))?\s*(?:"|in|inch|inches)?|(\d+(?:\.\d+)?)\s*(mm|cm|m)\b|(\d+)\s+(\d+)\s*\/\s*(\d+)\s*"|(\d+(?:\.\d+)?)\s*"|(\d{1,2})\s*\/\s*(\d{1,2})(?!\d)/gi;
  let m;
  const t=String(s).replace(/[′’]/g,"'").replace(/[″”]/g,'"');
  while((m=re.exec(t))!==null){
    if(m[1]!=null)      out.push((+m[1])*12 + (m[2]?+m[2]:0) + (m[3]?fracVal(m[3],m[4]):0));
    else if(m[5]!=null){ const u=m[6].toLowerCase(); out.push(u==="mm"?+m[5]/MM_IN:u==="cm"?+m[5]/CM_IN:+m[5]*M_IN); }
    else if(m[7]!=null) out.push((+m[7]) + fracVal(m[8],m[9]));
    else if(m[10]!=null)out.push(+m[10]);
    else if(m[11]!=null && +m[12]<12) out.push((+m[11])*12 + (+m[12]));
  }
  return out.map(v=>Math.round(v*100)/100);
}
function phxCatFor(name){
  if(/overhead garage door/i.test(name)) return "Garage Doors";
  if(/window/i.test(name)) return "Windows";
  return "Exterior Doors";
}
function phxTypeGuess(name, cat){
  if(cat==="Garage Doors") return "Garage Door";
  if(cat==="Windows"){
    if(/fixed|picture/i.test(name)) return "Picture (fixed)";
    if(/slider|sliding/i.test(name)) return "Horizontal Slider";
    if(/double[\s-]?hung/i.test(name)) return "Double Hung";
    if(/casement/i.test(name))        return "Casement";
    if(/awning/i.test(name))          return "Awning";
    if(/bifold|accordion/i.test(name))return "Bifold (Accordion)";
    return "Single Hung";
  }
  if(/french/i.test(name))            return "French";
  if(/patio|sliding|slider/i.test(name)) return "Slider";
  if(/pocket/i.test(name))            return "Pocket";
  if(/bifold/i.test(name))            return "Bifold";
  if(/pivot/i.test(name))             return "Pivot";
  if(/dutch/i.test(name))             return "Dutch";
  return "Hinged/ Casement";
}
/* Size read off the drawing. hAssumed marks a height the plan never gave. */
function parseOpeningSize(name, cat){
  const s=String(name);
  const defH = cat==="Garage Doors" ? GAR_H_DEFAULT : DOOR_H_DEFAULT;
  const d=dimTokens(s);

  /* an entry with sidelites measures the leaf plus both sidelites */
  if(/sidelite/i.test(s) && d.length>=2)
    return {w:Math.round(d[0]+2*d[1]), h:defH, hAssumed:true, wNote:"leaf + two sidelites"};

  if(d.length>=2){
    const k=bareUnitScale(d[0],d[1]);   /* 900 x 2100 is millimetres, 36 x 66 is inches */
    return {w:Math.round(d[0]*k), h:Math.round(d[1]*k), hAssumed:false, wNote:k!==1?"read as millimetres":""};
  }
  /* a bare pair carries no unit marks: 900 x 2100 (mm) or 36 x 66 (in) */
  const bare=s.match(/(\d+(?:\.\d+)?)\s*[x\u00d7]\s*(\d+(?:\.\d+)?)/i);
  if(bare){
    const a=+bare[1], b=+bare[2], k=bareUnitScale(a,b);
    return {w:Math.round(a*k), h:Math.round(b*k), hAssumed:false, wNote:k!==1?"read as millimetres":""};
  }
  /* no pair — try a four-digit door mark like 3068 */
  const mk=markCode(s);
  if(mk) return {w:mk.w, h:mk.h, hAssumed:false, wNote:"from door mark"};

  if(d.length===1) return {w:Math.round(d[0]), h:defH, hAssumed:true, wNote:""};
  return {w:36, h:defH, hAssumed:true, wNote:"", sizeUnknown:true};
}
/* Material choices for a style, series folded in so the salesman picks once. */
function phxMatOptions(cat,type){
  return phxRows(cat,type).map(r=>({
    key:r.series+"|"+r.material,
    label:r.material+(r.series==="Thin Line Aluminum"?" — Thin Line":""),
    rate:r.rateCents, row:r
  })).sort((a,b)=>a.rate-b.rate);
}
function phxRowByKey(cat,type,key){
  const parts=String(key||"").split("|");
  return phxRow(cat,type,parts[0],parts[1])||null;
}

let phxSched=null;   // the schedule the bot produced, as the salesman is editing it
let phxSchedSrc="";  // which plans it came from
let phxStep="windows";
let phxTypeQ={};     // per-row type search box

/* The four steps, in the order a salesman works them. */
const PHX_STEPS=[
  {key:"windows",  label:"Windows",         rateCat:"Windows"},
  {key:"int_doors",label:"Interior doors",  rateCat:"Exterior Doors"},
  {key:"ext_doors",label:"Exterior doors",  rateCat:"Exterior Doors"},
  {key:"garage",   label:"Garage doors",    rateCat:"Garage Doors"}
];
function phxStepMeta(k){ return PHX_STEPS.find(s=>s.key===k)||PHX_STEPS[0]; }
function phxGroupFor(name){
  if(/overhead garage door/i.test(name)) return "garage";
  if(/window/i.test(name)) return "windows";
  if(PHX_INTERIOR.test(name)) return "int_doors";
  return "ext_doors";
}

/* Build the schedule from an engine takeoff. Build plans only: an opening is
   taken when a floor-plan sheet reported it. */
function buildPhxSchedule(tk){
  const items=tkPhxItems(tk).filter(i=>(i.sheet_refs||[]).some(r=>/FLOOR PLAN|PLAN$/i.test(r)||!/ELEVATION/i.test(r)));
  const rows=[];
  items.forEach((it,n)=>{
    const group=phxGroupFor(it.item);
    const cat=phxStepMeta(group).rateCat;
    const type=phxTypeGuess(it.item,cat==="Garage Doors"?"Garage Doors":(group==="windows"?"Windows":"Exterior Doors"));
    const sz=parseOpeningSize(it.item, cat);
    const mats=phxMatOptions(cat,type);
    /* Default to the A-Series aluminum line — what Phoenician actually builds —
       and fall back to the cheapest option only where aluminum isn't offered. */
    const pref=mats.find(m=>m.key==="Standard|Aluminum")||mats[0];
    rows.push({ id:"OP"+String(n+1).padStart(2,"0"), group, cat, type, matKey:pref?pref.key:null,
      w:sz.w, h:sz.h, hAssumed:sz.hAssumed, wNote:sz.wNote, sizeUnknown:!!sz.sizeUnknown,
      qty:Math.max(1,Math.round(it.quantity)), botQty:Math.max(1,Math.round(it.quantity)),
      botW:sz.w, botH:sz.h,
      desc:it.item, refs:(it.sheet_refs||[]).join(", "), conf:it.confidence, verify:!!it.needs_verification });
  });
  const order={windows:0,int_doors:1,ext_doors:2,garage:3};
  rows.sort((a,b)=>order[a.group]-order[b.group]);
  phxSched=rows;
  phxStep=(PHX_STEPS.find(st=>rows.some(r=>r.group===st.key))||PHX_STEPS[0]).key;
  return rows;
}
function phxSchedLine(r){
  const row=phxRowByKey(r.cat,r.type,r.matKey);
  if(!row) return {row:null, cents:0, sqft:0};
  const sqft=(r.w*r.h)/144;
  return {row, sqft, cents:computeLine(row,r.w,r.h,"sqft",r.qty)};
}
function phxSchedTotal(){ return (phxSched||[]).reduce((a,r)=>a+phxSchedLine(r).cents,0); }
function phxStepRows(k){ return (phxSched||[]).filter(r=>r.group===k); }
function phxStepCount(k){ return phxStepRows(k).reduce((a,r)=>a+r.qty,0); }
function phxStepTotal(k){ return phxStepRows(k).reduce((a,r)=>a+phxSchedLine(r).cents,0); }

let phxPick=null;   // row whose type/material picker is open

/* Representative photo for a style, from the Phoenician catalog. */
function phxTypeShot(cat,type){
  const m=MODELS().find(x=>x.category===cat && x.under===type);
  return m ? `<img src="${modelImg(m)}" alt="${esc(m.name)}" loading="lazy" decoding="async">` : typeIcon(type);
}
/* What the picker offers for a category: every catalogued model, plus any style
   the catalog prices but has no photo of. Garage doors have one priced style and
   nineteen models, so without this the salesman could only ever pick one. */
function phxPickOptions(cat){
  const models=MODELS().filter(m=>m.category===cat);
  const out=models.map(m=>({kind:"model", key:m.id, label:m.name, sub:m.type, type:m.under, model:m,
    rate:phxMinRate(cat,m.under)}));
  phxTypes(cat).forEach(t=>{
    if(models.some(m=>m.under===t)) return;
    out.push({kind:"type", key:"T:"+t, label:t, sub:"", type:t, model:null, rate:phxMinRate(cat,t)});
  });
  return out;
}
function phxOptCard(r,o){
  const on = o.kind==="model" ? r.modelId===o.key : (!r.modelId && r.type===o.type);
  return `<button type="button" class="pick-card${on?" on":""}" data-picktype="${esc(r.id)}|${esc(o.key)}">

  const assumed=rows.filter(r=>r.hAssumed).length;

  return `
  <div class="sched-panel" id="openingSchedule">
    <div class="sched-head">
      <div><span>STEP 2 · SELECTIONS</span>
        <h4>${phxSched.length} openings · ${phxSched.reduce((a,r)=>a+r.qty,0)} units</h4>

    ${assumed?`<p class="sched-warn">${assumed} of these had no height on the plan — a standard leaf height is filled in and marked <b>assumed</b>.</p>`:""}
    ${phxStep==="int_doors"?`<p class="sched-note">Your sheet has one door rate table, so interior doors quote at the exterior per-square-foot rates. Confirm with Phoenician before sending.</p>`:""}

    <div class="sched-wrap2">

        <thead><tr><th>Mark</th><th>From the plan</th><th>Type &amp; material</th><th class="rt">W</th><th class="rt">H</th><th class="rt">Qty</th><th class="rt">Sq ft</th><th class="rt">Line</th><th></th></tr></thead>
        <tbody>
        ${rows.map(r=>{

                <span class="ty-thumb">${r.modelId&&modelById(r.modelId)?`<img src="${modelImg(modelById(r.modelId))}" alt="${esc(r.modelName||"")}" loading="lazy" decoding="async">`:phxTypeShot(r.cat,r.type)}</span>
                <span class="ty-txt"><b>${esc(r.modelName||r.type)}</b><i>${mat?esc(mat.label)+" · "+money(mat.rate)+"/sf":"choose material"}</i></span>
                <span class="ty-mag">${open?"✕":"⌕"}</span>

            </td>

document.addEventListener("click",(e)=>{

  if(!t) return;
  if(t.dataset.cat!==undefined){ memberCfg.cat=t.dataset.cat; memberCfg.model=null; memberCfg.openType=null; refreshStation2(); return; }
  if(t.dataset.model!==undefined){ e.preventDefault();
    const id=t.dataset.model;
    if(memberCfg.model===id){ memberCfg.model=null; memberCfg.openType=null; refreshStation2(); return; }
    const m=modelById(id); if(!m) return;
    memberCfg.model=id; const type=m.under; memberCfg.openType=type;
    const series=phxSeries(memberCfg.cat,type), mats=phxMaterials(memberCfg.cat,type);
    memberCfg.series=series[0];
    memberCfg.material=mats.find(mm=>phxRow(memberCfg.cat,type,memberCfg.series,mm))||mats[0];
    const g=(SIZE_GUIDE[memberCfg.cat]||[[36,48]])[Math.floor(((SIZE_GUIDE[memberCfg.cat]||[]).length)/2)]||[36,48];
    memberCfg.w=g[0]; memberCfg.h=g[1]; memberCfg.qty=1;
    memberCfg.basis = memberCfg.cat==="Garage Doors" ? "opening" : "sqft";
    refreshStation2();
    setTimeout(()=>document.getElementById("configurator")?.scrollIntoView({behavior:"smooth",block:"center"}),40);
    return;
  }
  if(t.dataset.cfgtype!==undefined){ e.preventDefault();
    const type=t.dataset.cfgtype;
    if(memberCfg.openType===type && !memberCfg.model){ memberCfg.openType=null; refreshStation2(); return; }
    memberCfg.model=null; memberCfg.openType=type;
    const series=phxSeries(memberCfg.cat,type), mats=phxMaterials(memberCfg.cat,type);
    memberCfg.series=series[0];
    memberCfg.material=mats.find(m=>phxRow(memberCfg.cat,type,memberCfg.series,m))||mats[0];
    const g=(SIZE_GUIDE[memberCfg.cat]||[[36,48]])[Math.floor(((SIZE_GUIDE[memberCfg.cat]||[]).length)/2)]||[36,48];
    memberCfg.w=g[0]; memberCfg.h=g[1]; memberCfg.qty=1;
    memberCfg.basis = memberCfg.cat==="Garage Doors" ? "opening" : "sqft";
    refreshStation2();
    setTimeout(()=>document.getElementById("configurator")?.scrollIntoView({behavior:"smooth",block:"center"}),40);
    return;
  }
  if(t.dataset.field!==undefined){ e.preventDefault();
    const f=t.dataset.field, v=t.dataset.val;
    if(f==="series") memberCfg.series=v;
    else if(f==="material") memberCfg.material=v;
    else if(f==="size"){ const [w,h]=v.split("x").map(Number); memberCfg.w=w; memberCfg.h=h; }
    refreshStation2(); return;
  }
  if(t.dataset.addcart!==undefined){ e.preventDefault(); addToCart(); refreshStation2(); renderLivePreview();
    toast("Added to quote"); return; }
  if(t.dataset.rmcart!==undefined){ e.preventDefault(); memberCart=memberCart.filter(x=>x.uid!==t.dataset.rmcart); refreshStation2(); renderLivePreview(); return; }
});

/* ============================================================
   WHOLE-BUILD MATERIAL ESTIMATOR (public) — price a full build,
   find the cheapest source per line, order via Builder Assist for a fee.
   ============================================================ */
const HOME_PRESETS = [
  {id:"starter", label:"Starter home", desc:"3 bd · 2 ba · 1 story", sqft:1600, beds:3, baths:2, stories:1, garageBays:2},
  {id:"family",  label:"Family home",  desc:"4 bd · 3 ba · 2 story", sqft:2400, beds:4, baths:3, stories:2, garageBays:2},
  {id:"custom",  label:"Custom home",  desc:"4 bd · 4 ba · 2 story", sqft:3600, beds:4, baths:4, stories:2, garageBays:3},
  {id:"estate",  label:"Estate",       desc:"5 bd · 6 ba · 2 story", sqft:5500, beds:5, baths:6, stories:2, garageBays:4}
];
let estimate = { home:{sqft:2400,beds:4,baths:3,stories:2,garageBays:2}, preset:"family", qty:{}, source:{}, pick:{}, gradePick:{}, grade:"any", built:false, order:null };
let finishOpen = {};
function feePct(){ return (DB.config && DB.config.convenienceFeePct!=null) ? +DB.config.convenienceFeePct : 1; }
function qtyFor(catId, h){
  const sf=Math.max(400,+h.sqft||0), beds=+h.beds||0, baths=+h.baths||0, stories=Math.max(1,+h.stories||1), bays=+h.garageBays||0;
  const foot=sf/stories, perim=4*Math.sqrt(Math.max(foot,1)), wall=perim*9*stories*0.85;
  const gdoors=Math.max(bays>0?1:0, Math.ceil(bays/2)); const r=(x)=>Math.max(0,Math.round(x));
  switch(catId){
    case "framing": return r(sf);
    case "foundation": return r(foot + bays*230);
    case "block_walls": return r(perim*1.5); // stem walls + Phoenix yard walls
    case "roof_cover": case "roof_flash": return +(foot*1.35/100).toFixed(1);
    case "roof_drain": return r(perim*1.1);
    case "ext_stucco": case "ext_paint": return r(wall);
    case "drywall": case "int_paint": return r(sf*2.6); // interior wall + ceiling board area
    case "insulation": return r(wall+foot);
    case "air_seal": case "kit_sink": case "water_soft": case "appliances": case "lowvolt":
    case "grading": case "landscape": case "closeout": return 1;
    case "windows": return Math.max(8, r(sf/130));
    case "ext_doors": return 3;
    case "patio_doors": return 1+(sf>2800?1:0);
    case "garage_doors": case "gar_openers": return gdoors;
    case "int_doors": return r(beds+baths+3);
    case "trim": return r(sf*0.85);
    case "kit_cab": return r(22+(sf>3000?8:0));
    case "bath_cab": return r(baths*6);
    case "counters": return r(55+baths*18);
    case "backsplash": return 32;
    case "tile_floor": return r(sf*0.30);
    case "carpet": return r(sf*0.30);
    case "resilient": return r(sf*0.35);
    case "stairs": return Math.max(0,stories-1);
    case "shelving": return r(beds*10+25);
    case "shower": return Math.max(1,baths);
    case "tubs": return Math.max(1,baths-1);
    case "toilets": return r(baths+(sf>2500?1:0));
    case "vanities": case "bath_acc": return Math.max(1,baths);
    case "plumb_trim": return r(baths*3+4);
    case "water_heater": return sf>3500?2:1;
    case "hvac": case "ductwork": case "thermostat": return Math.max(1,Math.ceil(sf/1800));
    case "exhaust": return r(baths+2);
    case "panel": return sf>4000?2:1;
    case "devices": return r(sf/16);
    case "lighting": return r(sf/70);
    case "fans": return r(beds+2);
    case "alarms": return r(beds+stories+1);
    case "concrete": return r(600+bays*150);
    case "patio": return 300;

/* ================================================================

   (admin-portal/estimator/estimator.html). That tool carried real
   estimating structure the catalog pricer never had: a material /
   labor / soft-cost split, waste on material, a labor multiplier,

   Catalog prices are MATERIAL rates. Labor is modeled per category as
   a factor of material — LAB_FACTOR below is a published, editable
   table, not a quote. Every number it produces is labeled as modeled.
   ================================================================ */
const LAB_FACTOR = {
  framing:0.85, foundation:0.90, block_walls:1.00,
  roof_cover:0.80, roof_flash:0.70, roof_drain:0.60,
  ext_stucco:1.20, ext_paint:1.50, insulation:0.50, air_seal:0.80,
  windows:0.35, ext_doors:0.40, patio_doors:0.35, garage_doors:0.30, gar_openers:0.50,
  drywall:1.10, int_paint:1.40, int_doors:0.50, trim:0.90,
  kit_cab:0.35, bath_cab:0.35, counters:0.40, backsplash:1.00,
  tile_floor:1.10, carpet:0.50, resilient:0.60, stairs:0.80, shelving:0.60,
  shower:1.20, tubs:0.50, toilets:0.40, vanities:0.40, bath_acc:0.50,
  kit_sink:0.40, plumb_trim:0.60, water_heater:0.50, water_soft:0.50,
  hvac:0.50, ductwork:0.90, thermostat:0.40, exhaust:0.60,
  panel:0.70, devices:1.20, lighting:0.60, fans:0.50, alarms:0.50,
  appliances:0.08, lowvolt:0.80,
  concrete:0.90, patio:0.90, grading:1.50, landscape:1.00,
  temp_fence:0.15, closeout:0.00
};
const SOFT_CATS = ["closeout","grading"];
function labFactor(catId){ return LAB_FACTOR[catId]!=null ? LAB_FACTOR[catId] : 0.6; }
function isSoftCat(catId){ return SOFT_CATS.indexOf(catId)>=0; }

const COST_DEFAULTS = { wastePct:5, labMult:1.0, contingPct:5, ohpPct:15, labOn:true };
function costCfg(){
  const c=(DB && DB.config && DB.config.cost) || {};
  const d=COST_DEFAULTS;
  return { wastePct:(c.wastePct!=null?+c.wastePct:d.wastePct), labMult:(c.labMult!=null?+c.labMult:d.labMult),
           contingPct:(c.contingPct!=null?+c.contingPct:d.contingPct), ohpPct:(c.ohpPct!=null?+c.ohpPct:d.ohpPct),
           labOn:(c.labOn!=null?!!c.labOn:d.labOn) };
}
function setCostCfg(patch){
  DB.config=DB.config||{}; DB.config.cost=Object.assign({}, costCfg(), patch); saveDB();
}
/* Builder Assist landed cost for the two categories BA stocks — drives the margin view. */
const BA_LANDED_PCT = { resilient:0.72, temp_fence:0.55 };

function estLineFor(s){
  const qty = estimate.qty[s.id]!=null ? +estimate.qty[s.id] : qtyFor(s.id, estimate.home);
  const srcs = sourcesFor(s.id);
  let key = estimate.source[s.id];
  if(!key || !srcs.find(x=>x.key===key)) key = srcs.length?srcs[0].key:null;
  let src = key?srcs.find(x=>x.key===key):null;
  let unit = src?src.priceCents:0;
  let pick = estimate.pick[s.id]||null;
  if(pick && pick.partner){ key=pick.brand; unit=pick.priceCents; src={key:pick.brand,label:pick.brand,tier:"partner",priceCents:pick.priceCents,partner:true}; }
  else if(pick && pick.brand===key) unit=pick.priceCents;
  else pick=null;
  return {cat:s, qty, srcs, key, src, unit, pick, lineCents:Math.round(unit*Math.max(0,qty))};
}
function estimateLines(){ return activeScope().map(estLineFor); }
function estimateTotals(){
  const lines=estimateLines(), g=costCfg();
  let mat=0, lab=0, soft=0, baSell=0, baCost=0;
  lines.forEach(l=>{
    const raw=l.lineCents;
    const m=Math.round(raw*(1+g.wastePct/100));
    const lc=g.labOn ? Math.round(raw*labFactor(l.cat.id)*g.labMult) : 0;
    if(isSoftCat(l.cat.id)) soft+=m+lc; else { mat+=m; lab+=lc; }
    l.matCents=m; l.labCents=lc;
    const lp=BA_LANDED_PCT[l.cat.id];
    if(lp!=null && l.src && l.src.direct){ baSell+=raw; baCost+=Math.round(raw*lp); }
  });
  const sub=lines.reduce((a,l)=>a+l.lineCents,0);
  const base=mat+lab+soft;
  const conting=Math.round(base*g.contingPct/100);
  const ohp=Math.round((base+conting)*g.ohpPct/100);
  const build=base+conting+ohp;
  const fee=Math.round(sub*feePct()/100);
  const h=estimate.home||{}, hsf=Math.max(1,+h.sqft||1), rsf=hsf+((+h.garageBays||0)*400);
  return {lines, sub, fee, total:sub+fee,
          mat, lab, soft, base, conting, ohp, build, grand:build+fee,
          psf:Math.round(build/100/hsf), psfRoof:Math.round(build/100/rsf),
          baSell, baCost, baMargin:baSell?Math.round(100*(baSell-baCost)/baSell):0, cfg:g};
}

/* One category's brand-by-brand comparison. */
function finishCompareTable(l){
  const srcs=(l.srcs||[]).slice(0, 10);
  if(!srcs.length) return `<p class="fsh-none">No competing source carries this category yet.</p>`;
  const lo=srcs[0].priceCents, hi=srcs[srcs.length-1].priceCents;
  const avg=Math.round(srcs.reduce((a,x)=>a+x.priceCents,0)/srcs.length);
  const all=(l.srcs||[]).length;
  return `
  <div class="fsh-cmp">
    <div class="fsh-cmp-stats">
      <div><small>CHEAPEST</small><b>${money(lo)}</b><i>${esc(srcs[0].label)}</i></div>
      <div><small>AVERAGE OF ${all}</small><b>${money(avg)}</b><i>per ${esc(l.cat.unit.replace(/^per /,""))}</i></div>
      <div><small>SPREAD ON THIS LINE</small><b>${money(Math.round((hi-lo)*Math.max(0,l.qty)))}</b><i>cheapest vs dearest × ${l.qty}</i></div>
    </div>
    <div class="fsh-tbl-wrap">
      <table class="fsh-tbl">
        <thead><tr><th>Brand</th><th>Tier</th><th class="rt">Unit</th><th class="rt">${l.qty} ${esc(l.cat.unit.replace(/^per /,""))}</th><th class="rt">vs cheapest</th><th></th></tr></thead>
        <tbody>
        ${srcs.map((x,i)=>{
          const line=Math.round(x.priceCents*Math.max(0,l.qty));
          const d=Math.round((x.priceCents-lo)*Math.max(0,l.qty));
          const on=x.key===l.key;
          return `<tr class="${on?"on":""}${x.direct?" ba":""}">
            <td class="fsh-b">${esc(x.label)}${x.direct?' <em>BA direct</em>':''}${i===0?' <i class="fsh-lo">cheapest</i>':''}</td>
            <td><span class="tier ${esc(x.tier)}">${esc(x.tier)}</span></td>
            <td class="rt num">${money(x.priceCents)}</td>
            <td class="rt num"><b>${money(line)}</b></td>
            <td class="rt num ${d?"up":"lo"}">${d?"+"+money(d):"—"}</td>
            <td class="rt">${on?'<span class="fsh-using">using</span>':`<button type="button" class="fsh-use" data-fsrc="${esc(l.cat.id)}" data-brand="${esc(x.key)}">Use</button>`}</td>
          </tr>`;}).join("")}
        </tbody>
      </table>
    </div>
    ${all>srcs.length?`<p class="fsh-more">Showing the ${srcs.length} lowest of ${all} sources carrying this category.</p>`:""}
  </div>`;
}

/* ============================================================
   PLANIQ — powered by the Blueprint Takeoff Engine.
   The plan reader is no longer a simulation. Sheets are read by the
   engine (takeoff/analyzer.py: per-sheet structured extraction, then
   cross-sheet consolidation), which returns a CSI-coded bill of
   materials with a derivation, confidence and sheet reference on
   every line, plus the RFIs the drawings leave open. engine.js is the
   browser port of the engine's schema, unit conversion, waste rules
   and consolidation merge, so a takeoff produced by the Python engine
   and one handled here are processed identically.

   Tenant-scoped: the Phoenician tenant sees only division 08 openings
   priced from their own catalog; the contractor tenant gets the whole
   build, with measured quantities replacing guessed ones across all
   500 brands.
   ============================================================ */
const TKD = () => (window.__TAKEOFF || null);
let planiqState={};
let planiqFiles={};

const PIQ_SLOTS=[
  {id:"structure", label:"Structure build plans",   hint:"Floor plans · framing · foundation", disc:"architectural / structural"},
  {id:"elevation", label:"Elevation plans",         hint:"Exterior elevations · wall detail",  disc:"architectural"},
  {id:"openings",  label:"Window · door · garage",  hint:"Opening schedules & sizes",          disc:"architectural"},
  {id:"mep",       label:"MEP plans",               hint:"Electrical · plumbing · HVAC",       disc:"mechanical / electrical / plumbing"},
  {id:"site",      label:"Site / grading plan",     hint:"Flatwork · drainage · landscape",    disc:"civil / landscape"}
];
function piqSlotsFor(scope){ return scope==="phoenician" ? [] : PIQ_SLOTS; }
function piqPlanFiles(scope){ const f=planiqFiles[scope]||{}; return Array.isArray(f.plans)?f.plans:[]; }
function piqLoaded(scope){
  if(scope==="phoenician") return piqPlanFiles(scope).map((f,i)=>({id:"plans"+i, label:f.name}));
  const f=planiqFiles[scope]||{};
  const batch=Array.isArray(f.allPlans)?f.allPlans.map((file,i)=>({id:"all-plans-"+i,label:file.name})):[];
  return batch.concat(PIQ_SLOTS.filter(s=>f[s.id]).map(s=>({id:s.id,label:f[s.id].name||s.label})));
}

/* ------------------------------------------------- engine pipeline */
const PIQ_STAGES=[
  "Rasterizing sheets — overview + high-resolution tile grid…",
  "Reading title blocks, scale and revision…",
  "Reading schedules, legends and note blocks…",
  "Taking off quantities with derivations…",
  "Consolidating across sheets — removing double counts…",
  "Normalizing units and applying CSI waste factors…"
];
function planiqRunMulti(scope){
  const host=document.getElementById("piqBody-"+scope); if(!host) return;
  const loaded=piqLoaded(scope);
  if(!loaded.length){ host.innerHTML='<p class="piq-idle">No sheets loaded yet.</p>'; return; }
  const tk=TKD();
  if(!tk){ host.innerHTML='<p class="piq-idle">No takeoff available.</p>'; return; }
  planiqLoad(scope, tk, loaded);
}
function planiqLoad(scope, tk, loaded){
  const host=document.getElementById("piqBody-"+scope); if(!host) return;
  planiqState[scope]={ tk, ba:tkDeriveBa(tk), loaded:loaded||[] };
  let i=0;
  host.innerHTML=`<div class="piq-steps" id="piqSteps-${scope}"></div>`;
  const stepsEl=document.getElementById("piqSteps-"+scope);
  const tick=()=>{
    if(!document.getElementById("piqSteps-"+scope)) return;
    if(i<PIQ_STAGES.length){ stepsEl.innerHTML+=`<div class="piq-step">${CHK} ${esc(PIQ_STAGES[i])}</div>`; i++; setTimeout(tick,200); }
    else host.innerHTML=planiqResult(scope, planiqState[scope]);
  };
  tick();
}
function planiqRun(scope, fname, fsize){ // legacy single-file entry, kept for the harness
  planiqFiles[scope]=planiqFiles[scope]||{};

}

/* Measured quantities become the estimator's quantities. */
function applyTakeoffToEstimate(ba){
  estimate.home={...estimate.home};
  if(ba.home.sqft) estimate.home.sqft=ba.home.sqft;
  if(ba.home.baths) estimate.home.baths=ba.home.baths;
  if(ba.home.garageBays) estimate.home.garageBays=ba.home.garageBays;
  if(ba.home.stories) estimate.home.stories=ba.home.stories;
  estimate.qty={}; estimate.source={}; estimate.pick={}; estimate.gradePick={};
  finishOpen={};
  Object.keys(ba.qty).forEach(k=>{ estimate.qty[k]=ba.qty[k]; });
  estimate.measured=Object.keys(ba.qty);
  estimate.built=true;
}

/* Phoenician: price the openings the plans gave us, from their own sheet.
   One size parser for both paths — the old inline regex read 9'-0" x 7'-0" as 0 x 7. */
function phxPlanLines(tk){
  const lines=[];
  tkPhxItems(tk).forEach(it=>{
    const name=String(it.item), q=Math.max(1,Math.round(it.quantity));
    const cat=phxCatFor(name), type=phxTypeGuess(name,cat);
    const sz=parseOpeningSize(name,cat);
    const row=phxRow(cat,type,"Standard","Aluminum")||phxRows(cat,type)[0];
    if(row) lines.push({desc:name, cat, type, qty:q, w:sz.w, h:sz.h, row,
      cents:computeLine(row,sz.w,sz.h,"sqft",q)});
  });
  return lines;
}

let lastWtId=null;
function show(view, sub){
  currentView=view;
  unmountBp3d();
  let html;
  switch(view){
    case "home": html=viewHome(); break;
    case "get-pricing": html=viewGetPricing(); break;
    case "walkthrough": html=viewWalkthrough(); break;
    case "walkthrough-done": html=viewWalkthroughDone(lastWtId); break;
    case "member-signin": html=viewSignin("member"); break;
    case "admin-signin": html=viewSignin("admin"); break;
    case "member-portal": html = (sub==="compare") ? viewMemberCompare() : ((session&&session.tenant==="general") ? viewContractorPortal(sub) : viewMemberPortal()); break;
    case "admin-portal": html=viewAdminPortal(sub); break;
    case "estimator": html=viewEstimator(); break;
    case "build-estimate": html=viewBuildEstimate(sub); break;
    default: html=viewHome(); view="home"; currentView="home";
  }
  app.innerHTML=html; window.scrollTo(0,0);
  if(view==="member-portal" && sub!=="compare"){ renderLivePreview(); if(lastQuote){ const host=document.getElementById("genQuoteHost"); if(host) host.innerHTML=generatedQuoteHtml(lastQuote); } }
  if(view==="estimator") mountEstimator();
}
function render(){
  const raw=location.hash||"";
  if(raw && !raw.startsWith("#/")){ if(currentView!=="home") show("home"); const el=document.getElementById(raw.slice(1)); if(el) el.scrollIntoView({behavior:"smooth"}); return; }
  const full = raw.startsWith("#/") ? raw.slice(2).replace(/\/$/,"") : "";
  if(full==="member-portal/assistify"){ location.replace("/member-portal/assistify"); return; }
  const slash = full.indexOf("/");
  const r = slash>=0 ? full.slice(0,slash) : full;
  const sub = slash>=0 ? full.slice(slash+1) : "";
  const isGen1 = r==="member-portal" && ["buildify","assistify-operations","growify"].includes(sub);
  if(r==="member-portal" && !sub){ location.hash="#/member-portal/buildify"; return; }
  if(isGen1 && !session) session={role:"member", username:"Authenticated contractor", tenant:"general", display:"General Contractor"};
  if(r==="member-portal" && !isGen1){ location.hash="#/member-portal/buildify"; return; }
  if(r==="admin-portal"||r==="estimator"||r==="build-estimate"){ location.hash="#/admin-signin"; return; }
  show(r||"home", sub);
}

function importCompetitorCSV(file){
  if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{
    const rows=parseCSV(String(rd.result)); if(!rows.length){ toast("CSV looked empty"); return; }
    const byBrand={};
    rows.forEach(r=>{ const brand=(r.brand||r.supplier||"Imported").trim(); if(!byBrand[brand]) byBrand[brand]=[];
      const price=Math.round((parseFloat(String(r.price||r.unitprice||r.unit_price||"0").replace(/[^0-9.]/g,""))||0)*100);
      byBrand[brand].push({ sku:(r.sku||"").trim()||"IMP-"+(byBrand[brand].length+1), name:(r.name||r.product||(brand+" item")).trim(), category:(r.category||"Other").trim(), unit:(r.unit||"each").trim(), priceCents:price });
    });
    let added=0, updated=0;
    Object.keys(byBrand).forEach(brand=>{ const c=DB.competitors.find(x=>x.brand.toLowerCase()===brand.toLowerCase());
      if(c){ c.products=byBrand[brand]; c.source="imported"; c.active=true; updated++; }
      else { DB.competitors.push({ id:Math.max(0,...DB.competitors.map(x=>x.id))+1, brand, kind:"Imported catalog", active:true, source:"imported", products:byBrand[brand] }); added++; }
    });
    saveDB(); show("admin-portal","competitors"); toast("Imported "+rows.length+" rows · "+added+" new, "+updated+" updated");
  }catch(err){ toast("Could not parse that CSV"); } };
  rd.readAsText(file);
}

  if(t.matches && t.matches("[data-comptoggle]")){ const id=+t.dataset.comptoggle; const c=DB.competitors.find(x=>x.id===id); if(c){ c.active=t.checked; saveDB(); } return; }
  if(t.matches && t.matches("[data-compimport]")){ importCompetitorCSV(t.files&&t.files[0]); return; }
});

/* ============================ INIT ============================ */
loadDB();
try{ if(document.body && document.body.insertAdjacentHTML) document.body.insertAdjacentHTML("beforeend", pictureDefs()); }catch(e){}
render();

</script>
