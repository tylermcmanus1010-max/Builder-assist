<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/gen1-operational.css"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}
</style></head><body>
<meta charset="utf-8">
<title>Builder Assist LLC</title>
<style>
:root {
  --ink: #071a36;
  --navy: #081f43;
  --blue: #0b4fd3;
  --blue-bright: #1674ff;
  --cyan: #68d4ff;
  --ice: #f2f7ff;
  --line: #d9e5f7;
  --muted: #5e6f89;
  --white: #ffffff;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--white);
  color: var(--ink);
  font-family: Arial, Helvetica, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; }
img { display: block; max-width: 100%; }

.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  height: 84px;
  display: grid;
  grid-template-columns: minmax(220px, 1fr) auto minmax(220px, 1fr);
  align-items: center;
  gap: 24px;
  padding: 0 4vw;
  background: rgba(255, 255, 255, 0.93);
  border-bottom: 1px solid rgba(7, 26, 54, 0.1);
  backdrop-filter: blur(16px);
}
.brand { display: inline-flex; align-items: center; gap: 11px; width: fit-content; }
.brand-mark { width: 42px; height: 42px; color: var(--blue); flex: 0 0 auto; }
.brand-copy { display: flex; align-items: baseline; gap: 7px; letter-spacing: -0.035em; }
.brand-copy strong { font-size: 16px; font-weight: 900; }
.brand-copy small { font-size: 10px; font-weight: 800; letter-spacing: 0.12em; color: var(--blue); }
.main-nav { display: flex; align-items: center; gap: 30px; font-size: 12px; font-weight: 700; color: #334866; }
.main-nav a { position: relative; padding: 8px 0; }
.main-nav a::after { content: ""; position: absolute; left: 0; right: 100%; bottom: 2px; height: 2px; background: var(--blue); transition: right .2s ease; }
.main-nav a:hover::after { right: 0; }
.header-cta { justify-self: end; display: inline-flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 18px; background: var(--ink); color: white; font-size: 12px; font-weight: 800; }
.header-cta svg, .button svg, .text-link svg { width: 18px; height: 18px; transition: transform .2s ease; }
.header-cta:hover svg, .button:hover svg, .text-link:hover svg { transform: translateX(4px); }

.hero { position: relative; min-height: calc(100vh - 84px); overflow: hidden; background: linear-gradient(135deg, #f7faff 0%, #eef5ff 100%); }
.hero::before { content: ""; position: absolute; inset: 0; opacity: .45; pointer-events: none; background-image: linear-gradient(rgba(11,79,211,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(11,79,211,.07) 1px, transparent 1px); background-size: 54px 54px; mask-image: linear-gradient(to right, black, transparent 72%); }
.hero-grid { position: relative; z-index: 1; display: grid; grid-template-columns: 47% 53%; min-height: calc(100vh - 84px); }
.hero-copy { display: flex; flex-direction: column; justify-content: center; padding: 72px 6vw 72px 8vw; }
.eyebrow, .kicker { display: flex; align-items: center; gap: 10px; margin: 0 0 24px; color: var(--blue); font-size: 11px; font-weight: 900; letter-spacing: .18em; }
.eyebrow span { width: 30px; height: 3px; background: var(--cyan); }
.hero h1 { margin: 0; max-width: 730px; font-size: clamp(52px, 6.1vw, 94px); line-height: .91; letter-spacing: -.065em; font-weight: 900; text-transform: uppercase; }
.hero h1 em { color: var(--blue); font-style: normal; }
.hero-lede { max-width: 610px; margin: 34px 0 0; color: #50627e; font-size: 18px; line-height: 1.7; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
.button { display: inline-flex; align-items: center; justify-content: center; gap: 15px; min-height: 56px; padding: 0 24px; font-size: 13px; font-weight: 800; transition: transform .2s ease, background .2s ease; }
.button:hover { transform: translateY(-2px); }
.button-primary { background: var(--blue); color: white; box-shadow: 0 14px 36px rgba(11,79,211,.24); }
.button-primary:hover { background: #0844b9; }
.button-secondary { border: 1px solid #bacbe4; background: rgba(255,255,255,.72); color: var(--ink); }
.trust-row { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 30px; color: #52657e; font-size: 11px; font-weight: 700; }
.trust-row span { display: flex; align-items: center; gap: 6px; }
.trust-row svg { width: 16px; height: 16px; color: var(--blue); }
.hero-visual { position: relative; min-height: 690px; overflow: hidden; }
.hero-visual > img { width: 100%; height: 100%; object-fit: cover; filter: saturate(.82) contrast(1.05); }
.image-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,22,50,.08) 30%, rgba(5,22,50,.84) 100%), linear-gradient(90deg, rgba(8,45,109,.24), transparent 45%); }
.hero-product-tag { position: absolute; left: 44px; bottom: 45px; color: white; }
.hero-product-tag span { display: block; margin-bottom: 10px; color: var(--cyan); font-size: 10px; font-weight: 900; letter-spacing: .18em; }
.hero-product-tag strong { font-size: clamp(25px, 2.6vw, 42px); line-height: 1.06; letter-spacing: -.04em; }
.dimension-card { position: absolute; top: 34px; right: 34px; min-width: 176px; padding: 19px; background: rgba(7,26,54,.86); border: 1px solid rgba(255,255,255,.2); color: white; backdrop-filter: blur(10px); }
.dimension-card small { display: block; color: var(--cyan); font-size: 8px; font-weight: 900; letter-spacing: .2em; }
.dimension-card strong { display: block; margin: 6px 0 2px; font-size: 31px; letter-spacing: -.05em; }
.dimension-card span { font-size: 11px; color: #c5d7f1; }
.hero-index { position: absolute; left: 2vw; bottom: 1vw; color: rgba(11,79,211,.13); font-size: clamp(80px, 12vw, 188px); line-height: 1; font-weight: 900; letter-spacing: -.09em; pointer-events: none; }
.hero-index span { color: rgba(104,212,255,.3); }

.section { padding: 118px 8vw; }
.section-intro { display: grid; grid-template-columns: minmax(190px, .65fr) 1.7fr; gap: 50px; align-items: start; margin-bottom: 64px; }
.section-number { color: var(--blue); font-size: 13px; font-weight: 900; }
.section-intro .kicker { margin-top: 14px; }
.section-intro h2, .process h2 { margin: 0; font-size: clamp(44px, 5vw, 76px); line-height: .94; letter-spacing: -.058em; text-transform: uppercase; }
.section-intro > div:last-child > p { max-width: 650px; margin: 25px 0 0; color: var(--muted); font-size: 17px; line-height: 1.7; }
.product-stack { display: grid; gap: 30px; }
.product-card { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(420px, .95fr); min-height: 560px; border: 1px solid var(--line); background: white; box-shadow: 0 26px 60px rgba(24,68,129,.08); overflow: hidden; }
.floor-card .product-image { order: 2; }
.floor-card .product-content { order: 1; }
.product-image { position: relative; min-height: 480px; overflow: hidden; background: #d8e5f8; }
.product-image img { width: 100%; height: 100%; object-fit: cover; transition: transform .7s cubic-bezier(.2,.7,.2,1); }
.product-card:hover .product-image img { transform: scale(1.035); }
.image-label { position: absolute; top: 22px; left: 22px; padding: 11px 14px; background: white; color: var(--blue); font-size: 9px; font-weight: 900; letter-spacing: .18em; }
.product-content { display: flex; flex-direction: column; justify-content: center; padding: clamp(38px, 5vw, 76px); }
.product-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
.product-id { color: var(--blue); font-size: 9px; font-weight: 900; letter-spacing: .18em; }
.product-title-row h3 { margin: 12px 0 0; max-width: 470px; font-size: clamp(34px, 3.4vw, 54px); line-height: .98; letter-spacing: -.055em; }
.availability { flex: 0 0 auto; display: flex; align-items: center; gap: 7px; margin-top: 2px; color: #47617f; font-size: 8px; font-weight: 900; letter-spacing: .15em; }
.availability i { width: 7px; height: 7px; background: #1ec87f; border-radius: 999px; box-shadow: 0 0 0 4px rgba(30,200,127,.13); }
.product-summary { margin: 25px 0; color: var(--muted); font-size: 15px; line-height: 1.7; }
.spec-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin: 2px 0 26px; background: var(--line); border: 1px solid var(--line); }
.spec-grid > div { min-width: 0; padding: 17px 15px; background: var(--ice); }
.spec-grid small { display: block; margin-bottom: 7px; color: #71829a; font-size: 7px; font-weight: 900; letter-spacing: .15em; }
.spec-grid strong { font-size: 12px; }
.fence-ad-callout { margin: -3px 0 25px; padding: 20px 21px; border-left: 4px solid var(--cyan); background: linear-gradient(135deg, #071a36, #0b4fd3); color: white; }
.fence-ad-callout > span { display: block; color: var(--cyan); font-size: 7px; font-weight: 900; letter-spacing: .17em; }
.fence-ad-callout h4 { margin: 9px 0 8px; font-size: 19px; line-height: 1.12; letter-spacing: -.025em; }
.fence-ad-callout p { margin: 0; color: #d6e5fb; font-size: 10px; line-height: 1.62; }
.fence-ad-callout > div { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 15px; }
.fence-ad-callout > div strong { padding: 6px 8px; border: 1px solid rgba(255,255,255,.25); color: white; font-size: 6px; letter-spacing: .09em; }
.feature-list { display: grid; gap: 12px; padding: 0; margin: 0 0 28px; list-style: none; color: #3f536f; font-size: 12px; }
.feature-list li { display: flex; align-items: center; gap: 9px; }
.feature-list svg { width: 17px; height: 17px; flex: 0 0 auto; color: var(--blue); }
.text-link { display: inline-flex; align-items: center; gap: 13px; width: fit-content; padding-bottom: 7px; border-bottom: 2px solid var(--blue); color: var(--blue); font-size: 12px; font-weight: 900; }

.price-comparison { position: relative; overflow: hidden; margin-top: 72px; padding: clamp(34px, 5vw, 66px); background: linear-gradient(145deg, #071a36, #0a347e); color: white; box-shadow: 0 28px 70px rgba(7,26,54,.18); }
.price-comparison::before { content: ""; position: absolute; inset: 0; opacity: .12; background-image: linear-gradient(rgba(255,255,255,.24) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.24) 1px, transparent 1px); background-size: 42px 42px; mask-image: linear-gradient(125deg, black, transparent 78%); pointer-events: none; }
.price-comparison > * { position: relative; z-index: 1; }
.price-comparison-head { display: grid; grid-template-columns: 1.2fr .8fr; gap: 60px; align-items: end; margin-bottom: 38px; }
.price-comparison-head > div > span { display: block; margin-bottom: 15px; color: var(--cyan); font-size: 8px; font-weight: 900; letter-spacing: .18em; }
.price-comparison-head h3 { margin: 0; font-size: clamp(42px, 5vw, 72px); line-height: .92; letter-spacing: -.06em; text-transform: uppercase; }
.price-comparison-head h3 em { color: var(--cyan); font-style: normal; }
.price-comparison-head > p { margin: 0; color: #c8d9f2; font-size: 14px; line-height: 1.72; }
.price-comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.price-card { display: flex; flex-direction: column; min-width: 0; padding: clamp(24px, 3vw, 38px); background: white; color: var(--ink); }
.price-card header { padding-bottom: 22px; border-bottom: 1px solid var(--line); }
.price-card header span { color: var(--blue); font-size: 8px; font-weight: 900; letter-spacing: .17em; }
.price-card header h4 { margin: 9px 0 0; font-size: clamp(24px, 2.4vw, 34px); line-height: 1; letter-spacing: -.045em; }
.price-pair { display: grid; grid-template-columns: 1fr; gap: 1px; margin: 22px 0 14px; padding: 1px; background: #cbd9ec; }
.price-pair > div { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto; column-gap: 20px; align-items: center; padding: 19px 17px; }
.price-pair small { grid-column: 1; grid-row: 1; display: block; min-height: 0; font-size: 7px; font-weight: 900; letter-spacing: .13em; }
.price-pair strong { grid-column: 2; grid-row: 1 / 3; display: block; margin: 0; font-size: clamp(24px, 2.2vw, 34px); line-height: 1; letter-spacing: -.055em; white-space: nowrap; }
.price-pair span { grid-column: 1; grid-row: 2; display: block; font-size: 8px; font-weight: 700; }
.competitor-price { background: #eef3f9; color: #65758b; }
.builder-price { background: var(--blue); color: white; }
.builder-price small { color: var(--cyan); }
.price-addon, .quality-note { display: flex; align-items: center; justify-content: space-between; gap: 18px; min-height: 48px; padding: 12px 15px; border: 1px solid #c6d7ee; background: var(--ice); color: #49607e; font-size: 9px; }
.price-addon strong { color: var(--blue); font-size: 11px; white-space: nowrap; }
.quality-note { justify-content: flex-start; color: var(--blue); }
.quality-note svg { width: 18px; height: 18px; flex: 0 0 auto; }
.quality-note strong { font-size: 10px; }
.price-card > p { margin: 21px 0 22px; color: #60728b; font-size: 11px; line-height: 1.68; }
.price-card .text-link { margin-top: auto; }
.pricing-disclaimer { margin: 20px 0 0; color: #8fa9cf; font-size: 8px; line-height: 1.6; }

.process { display: grid; grid-template-columns: .9fr 1.5fr; gap: 7vw; background: var(--navy); color: white; }
.kicker-light { color: var(--cyan); }
.process h2 { font-size: clamp(42px, 4.3vw, 68px); }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid rgba(255,255,255,.19); }
.steps article { min-height: 270px; padding: 28px 22px 24px; border-right: 1px solid rgba(255,255,255,.19); }
.steps article:last-child { border-right: 0; }
.steps span { color: var(--cyan); font-size: 10px; font-weight: 900; }
.steps h3 { margin: 62px 0 12px; font-size: 20px; letter-spacing: -.03em; }
.steps p { margin: 0; color: #aebfda; font-size: 12px; line-height: 1.7; }

.manufacturer { position: relative; overflow: hidden; background: linear-gradient(145deg, #0b4fd3 0%, #073ca6 58%, #06265d 100%); color: white; }
.manufacturer::before { content: ""; position: absolute; inset: 0; opacity: .16; background-image: linear-gradient(rgba(255,255,255,.25) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.25) 1px, transparent 1px); background-size: 42px 42px; mask-image: linear-gradient(110deg, black, transparent 76%); pointer-events: none; }
.manufacturer::after { content: ""; position: absolute; width: 620px; height: 620px; right: -310px; top: -280px; border: 110px solid rgba(104,212,255,.12); border-radius: 50%; pointer-events: none; }
.manufacturer-heading, .direct-flow, .manufacturer-promise { position: relative; z-index: 1; }
.manufacturer-heading { display: grid; grid-template-columns: minmax(190px, .58fr) 1.7fr; gap: 50px; align-items: start; }
.manufacturer-heading .kicker { margin-top: 14px; }
.manufacturer-heading h2 { max-width: 1100px; margin: 0; font-size: clamp(48px, 5.5vw, 84px); line-height: .92; letter-spacing: -.062em; text-transform: uppercase; }
.manufacturer-heading h2 em { color: var(--cyan); font-style: normal; }
.manufacturer-story { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 34px; padding-top: 28px; border-top: 1px solid rgba(255,255,255,.25); }
.manufacturer-story p { margin: 0; color: #d8e6ff; font-size: 15px; line-height: 1.75; }
.manufacturer-story strong { color: white; }
.direct-flow { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 68px; border: 1px solid rgba(255,255,255,.24); background: rgba(5,25,66,.24); backdrop-filter: blur(8px); }
.direct-flow article { position: relative; min-height: 320px; padding: 26px 26px 30px; border-right: 1px solid rgba(255,255,255,.24); }
.direct-flow article:last-child { border-right: 0; }
.direct-flow article:not(:last-child)::after { content: "→"; position: absolute; z-index: 2; top: 84px; right: -12px; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--cyan); color: var(--ink); font-size: 13px; font-weight: 900; }
.direct-flow article > span { color: #91dfff; font-size: 8px; font-weight: 900; letter-spacing: .16em; }
.flow-icon { position: relative; display: grid; place-items: center; width: 66px; height: 66px; margin: 34px 0 32px; border: 1px solid rgba(255,255,255,.42); border-radius: 50%; }
.flow-icon strong { position: relative; z-index: 1; font-size: 20px; }
.flow-icon i { position: absolute; inset: 8px; border-radius: 50%; background: rgba(104,212,255,.16); }
.direct-flow h3 { margin: 0 0 12px; font-size: 21px; letter-spacing: -.035em; }
.direct-flow p { margin: 0; color: #bfd1ef; font-size: 12px; line-height: 1.7; }
.flow-profit { background: rgba(104,212,255,.14); }
.flow-profit .flow-icon { background: var(--cyan); border-color: var(--cyan); color: var(--ink); }
.flow-profit .flow-icon i { background: transparent; }
.manufacturer-promise { display: grid; grid-template-columns: .35fr 1.25fr 1fr; gap: 32px; align-items: center; margin-top: 28px; padding: 32px; background: white; color: var(--ink); box-shadow: 0 24px 60px rgba(3,18,49,.22); }
.manufacturer-promise > span { color: var(--blue); font-size: 9px; font-weight: 900; letter-spacing: .18em; }
.manufacturer-promise > strong { font-size: clamp(23px, 2.25vw, 34px); line-height: 1.06; letter-spacing: -.045em; }
.manufacturer-promise > strong em { color: var(--blue); font-style: normal; }
.manufacturer-promise p { margin: 0; padding-left: 28px; border-left: 1px solid var(--line); color: #5f7088; font-size: 12px; line-height: 1.72; }

.software { position: relative; overflow: hidden; background: #f4f8ff; }
.software::before { content: ""; position: absolute; top: -180px; right: -120px; width: 620px; height: 620px; border-radius: 50%; background: radial-gradient(circle, rgba(22,116,255,.16), transparent 67%); pointer-events: none; }
.software-head { position: relative; display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 50px; }
.software-head .kicker { margin-top: 14px; }
.software-pill { padding: 11px 14px; border: 1px solid #bcd1ef; background: rgba(255,255,255,.7); color: var(--blue); font-size: 8px; font-weight: 900; letter-spacing: .17em; }
.sales-freedom { position: relative; display: grid; grid-template-columns: .9fr 1.35fr; gap: 54px; align-items: stretch; margin-bottom: 68px; padding: 36px; overflow: hidden; background: linear-gradient(125deg, #071a36, #0a347e); color: white; box-shadow: 0 24px 60px rgba(18,52,109,.18); }
.sales-freedom::after { content: ""; position: absolute; width: 230px; height: 230px; right: -120px; top: -120px; border: 48px solid rgba(104,212,255,.12); border-radius: 50%; }
.freedom-message, .freedom-roles { position: relative; z-index: 1; }
.freedom-message { display: flex; flex-direction: column; justify-content: center; }
.freedom-message > span { margin-bottom: 16px; color: var(--cyan); font-size: 8px; font-weight: 900; letter-spacing: .18em; }
.freedom-message h3 { max-width: 570px; margin: 0; font-size: clamp(30px, 3.1vw, 48px); line-height: .98; letter-spacing: -.052em; }
.freedom-roles { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid rgba(255,255,255,.2); }
.freedom-roles article { min-height: 190px; padding: 27px; border-right: 1px solid rgba(255,255,255,.2); }
.freedom-roles article:last-child { border-right: 0; background: rgba(104,212,255,.1); }
.freedom-roles small { display: block; margin-bottom: 34px; color: #92b1db; font-size: 7px; font-weight: 900; letter-spacing: .16em; }
.freedom-roles strong { display: block; color: var(--cyan); font-size: 21px; letter-spacing: -.035em; }
.freedom-roles p { margin: 9px 0 0; color: #c4d4ea; font-size: 10px; line-height: 1.65; }
.software-grid { position: relative; display: grid; grid-template-columns: minmax(380px, .82fr) minmax(620px, 1.28fr); gap: 6vw; align-items: center; }
.software-overline { margin: 0 0 20px; color: var(--blue); font-size: 10px; font-weight: 900; letter-spacing: .18em; }
.software-copy h2 { margin: 0; font-size: clamp(48px, 5.3vw, 80px); line-height: .91; letter-spacing: -.065em; text-transform: uppercase; }
.software-copy h2 em { color: var(--blue); font-style: normal; }
.software-lede { max-width: 590px; margin: 30px 0 34px; color: var(--muted); font-size: 16px; line-height: 1.72; }
.software-features { display: grid; border-top: 1px solid #cbdaf0; }
.software-features article { display: grid; grid-template-columns: 34px 1fr; gap: 15px; padding: 18px 0; border-bottom: 1px solid #cbdaf0; }
.software-features article > span { padding-top: 3px; color: var(--blue); font-size: 9px; font-weight: 900; }
.software-features strong { font-size: 13px; }
.software-features p { margin: 5px 0 0; color: #6a7a91; font-size: 11px; line-height: 1.55; }
.software-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 18px; margin-top: 30px; }
.software-actions > span { color: #6a7a91; font-size: 10px; font-weight: 700; }
.button-cyan { background: var(--cyan); color: var(--ink); box-shadow: 0 16px 38px rgba(28,156,211,.19); }
.button-cyan:hover { background: #8cdefe; }
.autoquote-video-showcase { align-self: center; }
.autoquote-video-frame { position: relative; z-index: 1; overflow: hidden; background: #020915; border: 1px solid rgba(255,255,255,.5); box-shadow: 0 30px 70px rgba(0,13,48,.45); }
.autoquote-video-frame video { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
.video-expand { position: absolute; z-index: 3; top: 10px; right: 10px; display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 0 10px; border: 1px solid rgba(255,255,255,.35); background: rgba(3,20,52,.8); color: white; font-size: 7px; font-weight: 900; cursor: pointer; backdrop-filter: blur(8px); }
.video-expand:hover { background: rgba(11,79,211,.94); border-color: var(--cyan); }
.video-expand svg { width: 16px; height: 16px; }

.booking-progress > div > span { display: grid; place-items: center; width: 29px; height: 29px; border-radius: 50%; background: #e7edf6; font-size: 9px; font-weight: 900; }
.booking-progress > div > strong { font-size: 9px; letter-spacing: .04em; }
.booking-progress > div.active { color: var(--blue); }
.booking-progress > div.active > span { background: var(--blue); color: white; }
.booking-progress > i { height: 1px; background: #d6e1ef; }
.booking-card-head { margin-bottom: 32px; }
.booking-card-head > span { color: var(--blue); font-size: 8px; font-weight: 900; letter-spacing: .18em; }
.booking-card-head h2 { margin: 10px 0 12px; font-size: clamp(31px, 3.1vw, 46px); line-height: .98; letter-spacing: -.052em; }
.booking-card-head p { max-width: 650px; margin: 0; color: #687a92; font-size: 12px; line-height: 1.7; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.field { display: grid; gap: 8px; }
.field-wide { grid-column: 1 / -1; }
.field > span { color: #3b506d; font-size: 9px; font-weight: 900; letter-spacing: .04em; }
.field input, .field select { width: 100%; min-height: 52px; padding: 0 15px; border: 1px solid #cbd8e9; border-radius: 0; outline: 0; background: white; color: var(--ink); font-size: 12px; transition: border-color .18s ease, box-shadow .18s ease; }
.field input::placeholder { color: #9ba9ba; }
.field input:focus, .field select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(11,79,211,.1); }
.booking-primary { display: inline-flex; align-items: center; justify-content: center; gap: 14px; min-height: 54px; margin-top: 28px; padding: 0 24px; border: 0; background: var(--blue); color: white; font-size: 11px; font-weight: 900; cursor: pointer; transition: transform .18s ease, background .18s ease; }
.booking-primary:hover:not(:disabled) { transform: translateY(-2px); background: #0844b9; }
.booking-primary:disabled { background: #a8b7cb; cursor: not-allowed; }
.booking-primary svg { width: 18px; height: 18px; }
.meeting-types { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
.meeting-types > button { position: relative; display: grid; grid-template-columns: 36px 1fr auto; align-items: center; gap: 12px; min-height: 84px; padding: 17px; border: 1px solid #cad8ea; background: white; color: var(--ink); text-align: left; cursor: pointer; }
.meeting-types > button > svg { width: 27px; height: 27px; color: var(--blue); }
.meeting-types > button > span { display: grid; }
.meeting-types strong { font-size: 12px; }
.meeting-types small { margin-top: 4px; color: #788aa3; font-size: 8px; }
.meeting-types button > i { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #e4ebf5; color: #95a7bf; opacity: 0; }
.meeting-types button > i svg { width: 13px; height: 13px; }
.meeting-types button.selected { border-color: var(--blue); box-shadow: inset 0 0 0 2px var(--blue); background: #f3f7ff; }
.meeting-types button.selected > i { background: var(--blue); color: white; opacity: 1; }
.calendar-time-grid { display: grid; grid-template-columns: 1.08fr .92fr; border: 1px solid #d5e0ef; }
.calendar-panel, .time-panel { min-width: 0; padding: 22px; }
.calendar-panel { border-right: 1px solid #d5e0ef; }
.calendar-head { display: grid; grid-template-columns: 30px 1fr 30px; align-items: center; gap: 10px; margin-bottom: 18px; }
.calendar-head strong { text-align: center; font-size: 12px; }
.calendar-head button { display: grid; place-items: center; width: 30px; height: 30px; border: 1px solid #d3dfed; background: white; color: var(--blue); cursor: pointer; }
.calendar-head button:disabled { color: #bdc8d6; cursor: not-allowed; }
.weekday-row, .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.weekday-row { margin-bottom: 7px; }
.weekday-row span { color: #8494aa; font-size: 7px; font-weight: 900; text-align: center; }
.calendar-grid > button, .calendar-grid > span { aspect-ratio: 1; }
.calendar-grid > button { border: 0; background: transparent; color: #324964; font-size: 9px; font-weight: 800; cursor: pointer; }
.calendar-grid > button:hover:not(:disabled) { background: #eaf2ff; color: var(--blue); }
.calendar-grid > button:disabled { color: #c6d0dd; cursor: not-allowed; }
.calendar-grid > button.today { box-shadow: inset 0 0 0 1px #9ab9e6; }
.calendar-grid > button.selected { background: var(--blue); color: white; box-shadow: none; }
.time-head { display: grid; margin-bottom: 17px; }
.time-head small { margin-bottom: 7px; color: var(--blue); font-size: 7px; font-weight: 900; letter-spacing: .15em; }
.time-head strong { min-height: 30px; font-size: 10px; line-height: 1.45; }
.time-head span { margin-top: 3px; color: #8b9aaf; font-size: 8px; }
.time-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.time-slots button { min-height: 34px; padding: 0 7px; border: 1px solid #d4dfec; background: white; color: #40556f; font-size: 8px; font-weight: 800; cursor: pointer; }
.time-slots button:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
.time-slots button.selected { background: var(--blue); border-color: var(--blue); color: white; }
.time-slots button:disabled { background: #f1f4f8; color: #b3bfce; cursor: not-allowed; }
.time-placeholder { min-height: 240px; display: grid; place-items: center; align-content: center; gap: 12px; color: #9aaabd; text-align: center; }
.time-placeholder svg { width: 35px; height: 35px; }

.schedule-actions { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.booking-back { margin-top: 28px; padding: 10px 0; border: 0; background: transparent; color: #5e718c; font-size: 10px; font-weight: 800; cursor: pointer; }
.booking-error { margin: 18px 0 -8px; padding: 12px 14px; border-left: 3px solid #df3f4a; background: #fff2f3; color: #a52b35; font-size: 10px; font-weight: 700; }
.confirmation-panel { max-width: 650px; margin: 0 auto; padding: 12px 0; text-align: center; }
.confirmation-check { display: grid; place-items: center; width: 66px; height: 66px; margin: 0 auto 22px; border-radius: 50%; background: var(--blue); color: white; box-shadow: 0 14px 34px rgba(11,79,211,.25); }

.confirmation-details { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; margin: 30px 0; padding: 1px; background: #d9e4f2; text-align: left; }

.confirmation-details small { display: block; margin-bottom: 7px; color: #8494aa; font-size: 7px; font-weight: 900; letter-spacing: .14em; }
.confirmation-details strong { display: block; color: #324964; font-size: 10px; line-height: 1.45; }
.calendar-download { margin: 0 auto; }

.cfg-field input,.cfg-field select{padding:9px 11px;border:1px solid var(--line);border-bottom:2px solid var(--blue);background:var(--ice);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}

.chips{display:flex;flex-wrap:wrap;gap:7px}

.cfg-price strong{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums}
.cfg-add{background:var(--blue);color:#fff;border:0;padding:13px 22px;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}

.cart-empty{margin-top:18px;padding:22px;border:1px dashed var(--line);text-align:center;color:var(--muted);font-size:13px}
.member-cart{margin-top:18px;border:1px solid var(--line);background:#fff}
.cart-line{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.cart-ic{width:34px;height:34px;flex:0 0 auto}

.cart-main{flex:1 1 auto;min-width:0}
.cart-main strong{display:block;font-size:14px}
.cart-main small{color:var(--muted);font-size:11px}
.cart-amt{font-variant-numeric:tabular-nums;font-weight:900}

@media (max-width:720px){.cfg-grid,.cfg-nums{grid-template-columns:1fr 1fr}}

/* ===================== PHOENICIAN REAL-PHOTO MODEL PICKER ===================== */
.model-block{margin-bottom:24px}
.model-head{margin-bottom:14px}
.model-head > span{display:block;color:var(--blue);font-size:10px;font-weight:900;letter-spacing:.16em}
.model-head h4{margin:3px 0 4px;font-size:16px;font-weight:900;color:var(--ink)}
.model-head small{color:var(--muted);font-size:12px}
.model-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.model-card{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--line);background:#fff;cursor:pointer;text-align:left;transition:border-color .12s,box-shadow .12s,transform .12s}
.model-card:hover{border-color:var(--blue);box-shadow:0 12px 28px rgba(7,26,54,.12);transform:translateY(-2px)}
.model-card.on{border-color:var(--blue);border-width:2px;box-shadow:0 12px 28px rgba(7,26,54,.16)}
.model-pic{position:relative;width:100%;aspect-ratio:4/3;background:var(--ice);border:1px solid var(--line);overflow:hidden;display:block}
.model-pic img{width:100%;height:100%;object-fit:cover;display:block}
.model-id{position:absolute;left:6px;top:6px;background:rgba(4,12,28,.72);color:#fff;font-size:9px;font-weight:900;letter-spacing:.06em;padding:2px 6px}
.model-name{font-size:13px;font-weight:900;color:var(--ink);line-height:1.25}
.model-meta{display:flex;flex-wrap:wrap;gap:4px}
.mtag{font-size:9px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--blue);background:var(--ice);border:1px solid var(--line);padding:2px 6px}
.mtag.fin{color:var(--muted)}
.model-from{font-size:12px;font-weight:900;color:var(--blue);margin-top:auto}
.model-from small{color:var(--muted);font-weight:700;font-size:10px}
.type-block{margin-top:8px}
.type-head{margin-bottom:12px}
.type-head > span{display:block;color:var(--muted);font-size:10px;font-weight:900;letter-spacing:.14em}
.type-head h4{margin:2px 0 0;font-size:14px;font-weight:900;color:var(--ink)}
/* configurator head — selected model with real photo */
.cfg-head.model{align-items:flex-start}
.cfg-head.model .cfg-photo{width:88px;height:66px;flex:0 0 auto;border:1px solid var(--line);overflow:hidden;background:#fff}
.cfg-head.model .cfg-photo img{width:100%;height:100%;object-fit:cover;display:block}
.cfg-head.model .cfg-spec{display:block;margin-top:6px;color:var(--muted);font-size:11px;font-style:normal;line-height:1.4}
/* cart line real-photo thumbnail */
.cart-ic.photo{width:44px;height:34px;border:1px solid var(--line);overflow:hidden;background:#fff}
.cart-ic.photo img{width:100%;height:100%;object-fit:cover;display:block}
/* pending upload file row */
.portal-file-list a.file-pending{opacity:.72}
.portal-file-list a.file-pending b{background:var(--ice);color:var(--muted);border:1px dashed var(--line);padding:3px 8px;font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
@media (max-width:560px){.model-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}

/* ===================== SCOTTSDALE LUXURY BENCHMARK ===================== */
.lux{border:1px solid var(--line);background:linear-gradient(180deg,#f7fbff,#fff);padding:18px;margin:18px 0}
.lux-head{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.lux-head > div > span{display:block;color:var(--blue);font-size:10px;font-weight:900;letter-spacing:.16em}
.lux-head strong{display:block;font-size:16px;font-weight:900;color:var(--ink);margin-top:3px;max-width:640px}
.lux-head small{max-width:360px;color:var(--muted);font-size:11px;line-height:1.5}
.lux-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.lux-card{border:1px solid var(--line);background:#fff;display:flex;flex-direction:column}
.lux-card-head{padding:14px 16px;border-bottom:1px solid var(--line);background:var(--ice)}
.lux-card-head span{font-size:9px;font-weight:900;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.lux-card-head h4{margin:2px 0 3px;font-size:20px;font-weight:900;color:var(--blue);font-variant-numeric:tabular-nums}
.lux-card-head small{color:var(--muted);font-size:11px;line-height:1.35;display:block}
.lux-vs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}

.lux-vs b{display:block;font-size:15px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums}
.lux-vs i{font-style:normal;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lux-pct.good b{color:var(--good,#0a7d33)}
.lux-pct.bad b{color:var(--bad,#c0362c)}
.lux-range{padding:8px 16px;font-size:11px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.lux-peers{padding:6px 0}
.lux-peer{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:7px 16px;font-size:12px;border-top:1px solid #eef2f7}
.lux-peer:first-child{border-top:0}
.lux-peer > span strong{display:block;font-weight:800;color:var(--ink);font-size:12px}
.lux-peer > span small{color:var(--muted);font-size:10px}
.lux-peer > b{font-variant-numeric:tabular-nums;font-weight:800;color:var(--ink);white-space:nowrap}
.lux-peer > i{font-style:normal;font-size:10px;font-weight:900;color:var(--muted);white-space:nowrap;min-width:78px;text-align:right}

@media (max-width:560px){.lux-peer{grid-template-columns:1fr auto}.lux-peer > i{display:none}}

/* tier badges */
.tier{font-size:9px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--line);white-space:nowrap}

.tier.standard{color:#0a4fd0;background:#eef4ff}
.tier.premium{color:#8a5a00;background:#fff6e6}
.tier.direct{color:#fff;background:var(--blue);border-color:var(--blue)}
/* cross-reference */
.xref{border:1px solid var(--line);background:#fff;margin:18px 0}

.xref-pick{display:flex;flex-direction:column;font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);gap:4px}
.xref-pick select{min-width:280px;max-width:min(92vw,420px);padding:10px 12px;border:1px solid var(--line);border-bottom:2px solid var(--blue);background:#fff;font-size:14px;font-weight:700}
.xref-summary{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.xref-summary > div{padding:14px 18px;border-right:1px solid var(--line)}
.xref-summary > div:last-child{border-right:0}
.xref-summary span{display:block;font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.xref-summary strong{display:block;font-size:22px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums;margin:2px 0}
.xref-summary .xref-ba strong{color:var(--blue)}
.xref-summary small{font-size:11px;color:var(--muted)}
.xref-summary .pos strong{color:#0a7d33}
.xref-summary .neg strong{color:#c0362c}
.xref-table{overflow-x:auto}
.xref-th,.xref-row{display:grid;grid-template-columns:2.4fr .9fr 1fr 1fr 1fr;gap:10px;align-items:center;padding:9px 18px;min-width:640px}
.xref-th{font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--ice);border-bottom:1px solid var(--line)}
.xref-row{border-top:1px solid #eef2f7;font-size:13px;font-variant-numeric:tabular-nums}
.xref-row span strong{font-weight:800;color:var(--ink);display:block;font-size:13px}
.xref-row span small{color:var(--muted);font-size:10px}
.xref-row b{font-weight:800;color:var(--ink)}
.xref-row b.ba{color:var(--blue)}
.xref-row b.save{color:#0a7d33}
.xref-row b.over{color:#c0362c}
.xref-row.me{background:#eef4ff}
.xref-row.me b{color:var(--blue)}
/* ultra-luxury */
.ultralux{border:1px solid #d8c48a;background:linear-gradient(180deg,#fffaf0,#fff);padding:18px;margin:18px 0}
.ultralux-head{margin-bottom:14px}
.ultralux-head > div > span{display:block;color:#8a5a00;font-size:10px;font-weight:900;letter-spacing:.18em}
.ultralux-head h3{margin:3px 0 4px;font-size:17px;font-weight:900;color:var(--ink)}
.ultralux-head small{color:var(--muted);font-size:11px}
.ultralux-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.ulx-card{border:1px solid #e6d6a8;background:#fff;display:flex;flex-direction:column}
.ulx-h{padding:12px 14px;border-bottom:1px solid #efe3c2;background:#fffaf0}
.ulx-h strong{display:block;font-size:14px;font-weight:900;color:var(--ink)}
.ulx-h small{font-size:10px;color:var(--muted)}
.ulx-items{padding:4px 0}
.ulx-line{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:7px 14px;border-top:1px solid #f4eeda;font-size:12px}
.ulx-line span{color:var(--ink);font-weight:600;line-height:1.25}
.ulx-line b{color:#8a5a00;font-weight:900;font-variant-numeric:tabular-nums;text-align:right}
.ulx-line i{grid-column:1/-1;color:var(--muted);font-style:normal;font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
/* brand directory */
.branddir{margin-top:18px}
.branddir-top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:12px}
.branddir-top > div > span{display:block;color:var(--blue);font-size:10px;font-weight:900;letter-spacing:.16em}
.branddir-top h3{margin:2px 0 0;font-size:16px;font-weight:900;color:var(--ink)}
.branddir-top input{padding:10px 12px;border:1px solid var(--line);border-bottom:2px solid var(--blue);background:#fff;font-size:14px;font-weight:700;min-width:min(92vw,300px)}
.branddir-list{border:1px solid var(--line);background:#fff}
.brandrow{border-top:1px solid var(--line)}
.brandrow:first-child{border-top:0}
.brandrow-h{display:grid;grid-template-columns:2.2fr .9fr 1.5fr auto auto;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:0;padding:12px 16px;cursor:pointer;font:inherit}

.bx-name strong{display:block;font-size:14px;font-weight:900;color:var(--ink)}

.bx-meta{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}

.bx-table{overflow-x:auto}
.bx-th,.bx-table > div:not(.bx-th){display:grid;grid-template-columns:2.6fr 2fr 1.1fr 1fr;gap:10px;align-items:center;padding:8px 16px;min-width:560px}

.xref-note{padding:9px 18px;background:#fff8ea;border-bottom:1px solid var(--line);border-left:3px solid #e0a800;font-size:11.5px;color:#6b5200;line-height:1.5}

.est-order-btn:hover{background:#0a3fb0}
.est-group{margin-bottom:18px;border:1px solid var(--line);background:#fff}
.est-group-h{background:var(--ice);padding:10px 16px;font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);border-bottom:1px solid var(--line)}
.est-th,.est-row{display:grid;grid-template-columns:2.4fr .8fr 2fr .9fr 1fr;gap:12px;align-items:center;padding:9px 16px;min-width:640px}
.est-th{font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.est-row{border-top:1px solid #eef2f7;font-size:13px}
.est-row.ba{background:#eefaf0}
.est-cat strong{font-weight:800;color:var(--ink);display:block;font-size:13px}
.est-cat small{color:var(--muted);font-size:10px}
.est-badge{display:inline-block;background:var(--good,#0a7d33);color:#fff;font-size:8px;font-weight:900;letter-spacing:.06em;padding:1px 5px;border-radius:2px}
.est-qty input{width:100%;padding:7px 8px;border:1px solid var(--line);border-bottom:2px solid var(--blue);background:var(--ice);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.est-src select{width:100%;padding:7px 8px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:600}
.est-unit{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.est-lt{font-variant-numeric:tabular-nums;font-weight:900;color:var(--ink);text-align:right}
.est-groups{overflow-x:auto}
/* order step */
.est-order-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:20px;max-width:1100px;margin:0 auto;padding:10px 5vw 70px;align-items:start}
.est-order-form{background:#fff;border:1px solid var(--line);padding:24px}
.est-order-form h3{margin:0 0 16px;font-size:16px}
.est-order-form label{display:flex;flex-direction:column;font-size:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);gap:5px;margin-bottom:14px}
.est-order-form input{padding:11px 12px;border:1px solid var(--line);border-bottom:2px solid var(--blue);background:var(--ice);font-size:15px;font-weight:600}
.est-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.est-check{flex-direction:row!important;align-items:center;gap:8px;text-transform:none!important;letter-spacing:0!important;font-weight:600!important;color:var(--ink)!important;font-size:12px!important}
.est-check input{flex:0 0 auto}
.est-order-summary{background:var(--navy);color:#fff;padding:24px;position:sticky;top:90px}
.est-order-summary h3{margin:0 0 16px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--cyan)}
.est-os-line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:13px;color:#dbe8fb}
.est-os-line b{font-variant-numeric:tabular-nums}
.est-os-total{display:flex;justify-content:space-between;padding:14px 0 4px;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.est-os-total span{color:var(--cyan);font-size:12px;letter-spacing:.06em;text-transform:uppercase;align-self:center}
.est-os-brands{margin-top:14px}
.est-os-brands small{display:block;color:#9fb6d8;font-size:9px;font-weight:900;letter-spacing:.1em;margin-bottom:6px}
.est-os-brands i{display:inline-block;background:rgba(255,255,255,.08);color:#cfe0f7;font-style:normal;font-size:10px;padding:2px 7px;margin:0 4px 4px 0}
/* done */
.est-done{max-width:820px;margin:0 auto;padding:60px 24px;text-align:center}
.est-done-mark{width:64px;height:64px;margin:0 auto 18px;display:grid;place-items:center;background:var(--good,#0a7d33);color:#fff;border-radius:50%}
.est-done-mark svg{width:32px;height:32px}
.est-done h1{font-size:clamp(28px,3.4vw,42px);margin:8px 0;letter-spacing:-.02em}
.est-done > p{color:var(--muted);font-size:15px;max-width:60ch;margin:0 auto 24px}
.est-done-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:0 0 24px;text-align:left}
.est-done-cards > div{background:#fff;padding:14px}
.est-done-cards small{display:block;color:var(--muted);font-size:9px;font-weight:900;letter-spacing:.1em;margin-bottom:4px}
.est-done-cards strong{font-size:19px;font-weight:900;font-variant-numeric:tabular-nums}
.est-done-cards strong.sm{font-size:12px;font-weight:700}
.est-done-items{border:1px solid var(--line);background:#fff;text-align:left;margin-bottom:24px;max-height:340px;overflow:auto}
.est-di-h,.est-done-items > div{display:grid;grid-template-columns:2fr 2fr .7fr 1fr;gap:10px;padding:8px 14px;font-size:12px;align-items:center}
.est-di-h{position:sticky;top:0;background:var(--ice);font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.est-done-items > div:not(.est-di-h){border-top:1px solid #eef2f7;font-variant-numeric:tabular-nums}
.est-done-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
@media (max-width:820px){
  .est-hero,.est-order-grid{grid-template-columns:1fr}
  .est-summary{grid-template-columns:1fr 1fr;position:static}
  .est-summary .est-order-btn{grid-column:1/-1;padding:14px}
  .est-done-cards{grid-template-columns:1fr 1fr}
  .est-fields,.est-presets{grid-template-columns:1fr 1fr}
}
/* ---------- D1: horizontal overflow at phone width -------------------------
   A `1fr` grid track cannot shrink below its items' min-content; `.est-fields`
   measured 502px of min-content (two columns of inputs), which forced the
   whole `.est-hero` past a 390px viewport. minmax(0,1fr) lets the tracks
   shrink. Placed after the page's own @media (max-width:820px) block so it
   wins on source order without !important. -------------------------------- */
@media (max-width:560px){
  .est-hero{grid-template-columns:minmax(0,1fr)}
  .est-fields{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .est-presets{grid-template-columns:minmax(0,1fr)}
  .est-summary{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}

.ac-field-note{grid-column:1/-1;margin:0;color:var(--muted);font-size:11px;line-height:1.5}

/* ===================== IMPERSONATION / PLANIQ / ORDER DESK / PAYMENT ===================== */
.imp-bar{position:sticky;top:0;z-index:80;background:#3b2a00;color:#ffe9b3;font-size:12px;padding:10px 5vw;display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-bottom:2px solid #e0a800}
.imp-bar span{background:#e0a800;color:#231800;font-size:9px;font-weight:900;letter-spacing:.12em;padding:2px 8px}
.imp-bar b{color:#fff}
.imp-bar button{margin-left:auto;background:transparent;border:1px solid #e0a800;color:#ffe9b3;font-size:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;cursor:pointer}
.imp-bar button:hover{background:#e0a800;color:#231800}
.ac-member{justify-content:space-between}
.ac-member > div:nth-child(2){flex:1;min-width:0;margin:0 14px}
.ac-member-actions{display:flex;align-items:center;gap:10px}
.ac-impbtn{background:var(--ink);color:#fff;border:0;padding:9px 14px;font-size:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.ac-impbtn:hover{background:var(--blue)}
/* PlanIQ */
.piq{border:1px solid var(--line);background:#fff;margin-top:18px}
.piq-head{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;padding:16px 18px;background:linear-gradient(135deg,#071a36,#0a3f9e);color:#fff}
.piq-head > div > span{display:block;color:var(--cyan);font-size:10px;font-weight:900;letter-spacing:.18em}
.piq-head h3{margin:3px 0 4px;font-size:17px;font-weight:900;color:#fff}
.piq-head small{color:#c6d7ef;font-size:11.5px;line-height:1.5;display:block;max-width:62ch}
.piq-drop{display:flex;flex-direction:column;align-items:center;gap:2px;border:2px dashed rgba(255,255,255,.4);padding:14px 26px;cursor:pointer;transition:border-color .12s,background .12s}
.piq-drop:hover{border-color:var(--cyan);background:rgba(255,255,255,.06)}
.piq-drop b{font-size:20px;color:var(--cyan)}
.piq-drop strong{font-size:12px;font-weight:900;letter-spacing:.04em;text-transform:uppercase}
.piq-drop small{color:#9fb6d8;font-size:9px;font-weight:800;letter-spacing:.08em}
.piq-body{padding:14px 18px}
.piq-idle{color:var(--muted);font-size:12px;margin:0}
.piq-steps{display:grid;gap:6px}
.piq-step{font-size:12px;color:var(--ink);display:flex;align-items:center;gap:8px;animation:piqin .25s ease}
.piq-step svg{color:var(--good,#0a7d33);width:14px;height:14px}
@keyframes piqin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.piq-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:12px}
.piq-sum > div{background:var(--ice);padding:12px 14px}
.piq-sum small{display:block;font-size:9px;font-weight:900;letter-spacing:.1em;color:var(--muted)}
.piq-sum b{display:block;font-size:14px;font-weight:900;color:var(--ink);margin:2px 0;word-break:break-word}
.piq-sum i{font-style:normal;font-size:10px;color:var(--muted)}
.piq-sched{border:1px solid var(--line)}
.piq-th,.piq-row{display:grid;grid-template-columns:2.4fr 1fr .6fr 1fr;gap:10px;padding:8px 14px;align-items:center;font-size:12.5px}
.piq-th{background:var(--ice);font-size:9px;font-weight:900;letter-spacing:.1em;color:var(--muted);border-bottom:1px solid var(--line)}
.piq-row{border-top:1px solid #eef2f7;font-variant-numeric:tabular-nums}
.piq-row.dim{color:var(--muted)}
.piq-row b{font-weight:900;text-align:right}
.piq-total{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;background:#eef4ff;border-top:1px solid var(--line);font-size:12px;font-weight:700}
.piq-total b{font-size:16px;font-weight:900;color:var(--blue);font-variant-numeric:tabular-nums}
.piq-actions{display:grid;gap:8px;margin-top:12px}
.piq-actions small{color:var(--muted);font-size:11px}
.piq-fine{margin:0;padding:10px 18px;border-top:1px dashed var(--line);color:var(--muted);font-size:10.5px}
.gc-alt{margin-top:14px}
/* payment options */
.est-payhead{margin:18px 0 10px!important}
.est-pay{display:grid;gap:8px;margin-bottom:14px}
.est-order-form label.est-payopt,.est-payopt{display:grid!important;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);padding:11px 12px;cursor:pointer;text-transform:none!important;letter-spacing:0!important;font-weight:600!important;color:var(--ink)!important;margin:0!important}
.est-payopt input{justify-self:start}
.est-payopt span{text-align:left}
.est-payopt.on{border-color:var(--blue);border-width:2px;background:var(--ice)}
.est-payopt strong{display:block;font-size:13px;font-weight:900}
.est-payopt small{display:block;color:var(--muted);font-size:11px;line-height:1.45}
.est-payopt > b{font-variant-numeric:tabular-nums;font-weight:900;color:var(--ink);white-space:nowrap}
.est-paystat{font-style:normal;font-size:10px;color:var(--good,#0a7d33);font-weight:800}
/* shortfall cards */
.sfall{border:1px solid var(--line);border-left:4px solid var(--muted);background:#fff;padding:10px 12px}
.sfall b{display:block;font-size:12px;font-weight:900;color:var(--ink);margin-bottom:2px}
.sfall span{font-size:11.5px;color:var(--muted);line-height:1.5;display:block}
.sfall.high{border-left-color:#c0362c}
.sfall.high b{color:#c0362c}
.sfall.med{border-left-color:#e0a800}
.sfall.low{border-left-color:#7f9bc4}
.est-done-short{text-align:left;border:1px solid var(--line);background:var(--ice);padding:14px;margin-bottom:24px;display:grid;gap:8px}
.est-done-short small{font-size:9px;font-weight:900;letter-spacing:.12em;color:var(--muted)}
.est-done-short i{font-style:normal;font-size:11px;color:var(--muted)}
.chn{font-style:normal;font-size:9px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--blue);background:var(--ice);border:1px solid var(--line);padding:1px 6px;white-space:nowrap}
/* order desk */
.od-readiness{border:1px solid #e2c877;background:#fffaf0;padding:14px;margin-bottom:18px}
.od-rhead span{font-size:10px;font-weight:900;letter-spacing:.14em;color:#8a5a00}
.od-rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-top:10px}
.od-order{border:1px solid var(--line);margin-bottom:16px;background:#fff}
.od-ohead{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--ice);border-bottom:1px solid var(--line)}
.od-ohead > div:first-child span{font-size:10px;font-weight:900;letter-spacing:.1em;color:var(--blue)}
.od-ohead strong{display:block;font-size:17px;font-weight:900}
.od-ohead small{color:var(--muted);font-size:11px}
.od-ostats{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.od-ostats span{display:grid}
.od-ostats small{font-size:8px;font-weight:900;letter-spacing:.1em;color:var(--muted)}
.od-ostats b{font-size:14px;font-weight:900;font-variant-numeric:tabular-nums}
.od-ostats b.sm{font-size:11px}
.od-status b{color:#e0a800}
.od-status.done b{color:var(--good,#0a7d33)}
.od-adv{background:var(--ink);color:#fff;border:0;padding:9px 13px;font-size:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.od-adv:hover{background:var(--blue)}
.od-adv:disabled{opacity:.4;cursor:default}
.od-pos{overflow-x:auto}
.od-po-th,.od-po{display:grid;grid-template-columns:2.4fr 1.1fr .5fr .6fr .9fr 1.2fr;gap:10px;align-items:center;padding:8px 16px;min-width:760px}
.od-po-th{font-size:9px;font-weight:900;letter-spacing:.1em;color:var(--muted);border-bottom:1px solid var(--line)}
.od-po{border-top:1px solid #eef2f7;font-size:12px}
.od-brand strong{display:block;font-weight:800}
.od-brand small{color:var(--muted);font-size:10px;line-height:1.3}
.od-po b{font-variant-numeric:tabular-nums;font-weight:900}
.od-st{font-style:normal;font-size:10px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.od-st.submitted{color:var(--muted)}
.od-st.quote{color:#c0362c}
.od-st.ack{color:#e0a800}
.od-st.sched{color:var(--blue)}
.od-st.done{color:var(--good,#0a7d33)}
.od-more{padding:8px 16px;font-size:11px;color:var(--muted)}
.od-oshort{padding:12px 16px;border-top:1px dashed var(--line);display:grid;gap:8px}
.od-oshort > span{font-size:9px;font-weight:900;letter-spacing:.12em;color:var(--muted)}
.chn.api{color:#0a7d33}
.chn.dealer{color:#c0362c}
.chn.retail{color:#8a5a00}
.chn.rental{color:#5b4bb5}
@media (max-width:720px){.od-ostats{width:100%;justify-content:flex-start}}

/* ===================== READABILITY: black fill-in text ===================== */
input, select, textarea { color:#000 !important; }
input::placeholder, textarea::placeholder { color:#8b97a8 !important; }

/* ===================== PRODUCT PICTURES (runtime SVG) ===================== */
.ppic{display:inline-block;width:64px;height:48px;flex:0 0 auto;border:1px solid var(--line);background:#fff;overflow:hidden;border-radius:2px}
.ppic svg{width:100%;height:100%;display:block}
.ppic.lg{width:100%;height:96px}
.bx-th,.bx-table > div:not(.bx-th){grid-template-columns:56px 2.4fr 2fr 1.1fr 1fr;min-width:600px}
.bx-table .ppic{width:48px;height:36px}

/* ===================== GRADES ===================== */
.grade{display:inline-block;font-size:8.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:2px;white-space:nowrap}
.grade.luxury{background:#241a08;color:#e8c76a}
.grade.premium{background:#fff3d6;color:#8a5a00;border:1px solid #e2c877}
.grade.standard{background:#eef4ff;color:#0a4fd0;border:1px solid #c9d9f2}
.grade.builder{background:#eefaf0;color:#0a7d33;border:1px solid #bfe4c8}
.grade.economy{background:#f0f2f5;color:#5a6572;border:1px solid #d8dee6}
.grade-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grade-chips .gc{padding:6px 12px;border:1px solid var(--line);background:#fff;color:#000;font-size:11px;font-weight:800;cursor:pointer;text-transform:capitalize}
.grade-chips .gc:hover{border-color:var(--blue);color:var(--blue)}
.grade-chips .gc.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.est-gradebar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border:1px solid var(--line);background:#fff;padding:12px 16px;margin-bottom:14px}
.est-gradebar > div > span{display:block;font-size:9px;font-weight:900;letter-spacing:.12em;color:var(--blue)}
.est-gradebar strong{font-size:13px;font-weight:900;color:var(--ink)}
.est-gradeapply{background:var(--blue);color:#fff;border:0;padding:9px 14px;font-size:10px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.est-gradeapply:hover{background:#0a3fb0}

/* ===================== FINISHING PICKER (5 ranked suggestions) ===================== */
.est-cat .fpick-btn{margin-top:5px;background:var(--ice);border:1px solid var(--line);color:var(--blue);font-size:9.5px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;cursor:pointer}
.est-cat .fpick-btn:hover{border-color:var(--blue)}
.est-cat .fpick-btn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.fpick{grid-column:1/-1;border:1px solid var(--blue);background:#f7faff;padding:12px 14px;margin:2px 0 6px}
.fpick-head{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;margin-bottom:10px}
.fpick-head > span{font-size:10px;font-weight:900;letter-spacing:.1em;color:var(--blue)}
.fpick-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.fcard{display:flex;flex-direction:column;gap:6px;text-align:left;background:#fff;border:1px solid var(--line);padding:9px;cursor:pointer;transition:border-color .12s,box-shadow .12s,transform .12s;font:inherit}
.fcard:hover{border-color:var(--blue);box-shadow:0 10px 24px rgba(7,26,54,.1);transform:translateY(-1px)}
.fcard.on{border-color:var(--blue);border-width:2px;background:var(--ice)}
.fcard .ppic{width:100%;height:74px}
.fcard-rank{position:absolute}
.fcard-name{font-size:11.5px;font-weight:800;color:var(--ink);line-height:1.3;min-height:29px}
.fcard-brand{font-size:10px;color:var(--muted)}
.fcard-row{display:flex;justify-content:space-between;align-items:center;gap:6px}
.fcard-price{font-size:12.5px;font-weight:900;color:var(--blue);font-variant-numeric:tabular-nums}
.fcard-line{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.fpick-note{margin:8px 0 0;font-size:10.5px;color:var(--muted)}
.est-row .picked{display:inline-block;margin-top:3px;font-size:10px;color:var(--good,#0a7d33);font-weight:800}

/* ===================== PLAN TEMPLATE SLOTS ===================== */
.piq-slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;padding:14px 18px;background:#0b2a5e}
.piq-slot{display:flex;flex-direction:column;gap:3px;border:1.5px dashed rgba(255,255,255,.35);padding:10px 12px;cursor:pointer;transition:border-color .12s,background .12s;color:#fff}
.piq-slot:hover{border-color:var(--cyan);background:rgba(255,255,255,.06)}
.piq-slot.loaded{border-style:solid;border-color:var(--cyan);background:rgba(104,212,255,.1)}
.piq-slot strong{font-size:11px;font-weight:900;letter-spacing:.03em}
.piq-slot small{font-size:9px;color:#9fb6d8;font-weight:700}
.piq-slot .piq-file{font-size:9.5px;color:var(--cyan);font-weight:800;word-break:break-all}
.piq-slot b{font-size:14px;color:var(--cyan)}
.piq-tchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.piq-tchips i{font-style:normal;font-size:9px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;background:#eef4ff;color:var(--blue);border:1px solid #c9d9f2;padding:2px 7px}
.est-cat{display:flex;gap:9px;align-items:flex-start;min-width:0}
.est-cat > .ppic{width:46px;height:36px;margin-top:1px}
.est-cat > span{min-width:0}
.est-prodline{color:var(--muted);font-size:10px}
.est-done-items .grade{font-size:7.5px;padding:1px 5px}

/* ===================== PHOENIX 5-QUOTE CARDS / SEARCH / PARTNER ===================== */

/* ---------- Runtime retailer photos: blueprint fallback plate --------------
   ~120 product photos are composed at runtime from retailer hosts (Lowe's,
   Home Depot, Trane, Western Window Systems...). Those hosts load from an
   ordinary web host and are blocked outright by the artifact CSP. Every one
   of them is paired with a navy/cyan plate that takes over on error, so the
   layout and the aspect box are identical on every host. ------------------ */
.bp-plate{display:block;width:100%;height:100%;background:var(--navy)}
.bp-plate svg{display:block;width:100%;height:100%}
/* The plate is what the box shows by default; the retailer photo is revealed
   only once it has actually decoded (`.ph-on`, set by the delegated `load`
   listener). Waiting for an *error* is not enough: a lazy image that is never
   fetched, or a request that hangs, never fires one — and on an Artifact host
   none of these ever load at all. Defaulting to the plate makes every host
   render the same box, never a white gap or a broken-image glyph. */
.ps-real,.rp-pic{background:var(--navy)}
.ps-real .ps-fb,.rp-pic .rp-fallback{display:block;position:absolute;inset:0;z-index:1}
.ps-real img[data-rimg],.rp-pic img[data-rimg]{opacity:0;background:transparent;transition:opacity .18s ease}
.ps-real.ph-on,.rp-pic.ph-on{background:#fff}

/* ---- pre-existing 390px overflow inside two admin tabs -------------------
   Competitor Intel: `.xref-pick select` carried min-width:280px, so the
   category picker could not shrink inside a 307px panel (the table beside it

function tkDivisionCode(category, allowNumeric){
  if(!category) return "00";
  const low = String(category).toLowerCase();
  if(allowNumeric!==false){
    const m = low.match(/^\s*(?:div(?:ision)?\.?\s*)?(\d{1,6})(?:\s*[-:.,]\s*|\s+|$)([a-z%]*)/);
    if(m){
      const digits=m[1], nxt=m[2]; let code=null;
      if(digits.length<=2) code=digits.padStart(2,"0"); else if(digits.length>=5) code=digits.slice(0,2);
      if(code && TK_DIVISIONS[code] && TK_UNIT_WORDS.indexOf(nxt)<0) return code;
    }
  }
  let best=null;
  for(const code in TK_DIVISIONS){
    const name=TK_DIVISIONS[code].toLowerCase();
    if(low.indexOf(name)>=0 && (!best || name.length>best[0])) best=[name.length,code];
  }
  for(const [code,kws] of TK_CATEGORY_KEYWORDS){
    for(const k of kws) if(low.indexOf(k)>=0 && (!best || k.length>best[0])) best=[k.length,code];
  }
  return best?best[1]:"00";
}
function tkNormalizeCategory(category, hint){
  let code=tkDivisionCode(category,true);
  if(code==="00" && hint) code=tkDivisionCode(hint,false);
  return code==="00" ? "00 Uncategorized" : code+" "+TK_DIVISIONS[code];
}
function tkWastePct(item, factors){
  const unit=tkNormalizeUnit(item.unit);
  if(unit==="LS") return 0;
  const code=tkDivisionCode(tkNormalizeCategory(item.category,item.item));
  if(unit==="EA" && TK_EA_WASTE_DIVISIONS.indexOf(code)<0) return 0;
  return +(factors&&factors[code]!=null?factors[code]:0);
}
function tkQtyWithWaste(item, factors){
  const pct=tkWastePct(item,factors);
  const q=item.quantity*(1+pct/100);
  if(TK_DISCRETE_UNITS.indexOf(tkNormalizeUnit(item.unit))>=0) return Math.ceil(Math.round(q*1e6)/1e6);
  return Math.round(q*1e4)/1e4;
}
function tkFmtQty(q){
  if(q==null) return "";
  if(Number.isInteger(q)) return String(q);
  if(Math.abs(q)<1) return String(+q.toPrecision(4));
  return String(+q.toFixed(4)).replace(/\.?0+$/,"")||String(q);
}
function tkNormText(s){ return String(s||"").toLowerCase().trim().replace(/["'""'']/g,"").replace(/[^a-z0-9#/.x@ -]/g," ").replace(/\s+/g," "); }
function tkItemKey(it){ return [tkNormalizeCategory(it.category,it.item),tkNormText(it.item),tkNormText(it.specification),tkNormalizeUnit(it.unit)].join("|"); }
/* exact-key merge — the engine's deterministic consolidation tidy-up */
function tkMergeItems(items){
  const groups=new Map();
  (items||[]).forEach(it=>{
    const [unit,factor]=tkUnitScale(it.unit);
    const norm=Object.assign({},it,{category:tkNormalizeCategory(it.category,it.item),unit,
      quantity:Math.round(it.quantity*factor*1e4)/1e4});
    const k=tkItemKey(norm);
    if(!groups.has(k)) groups.set(k,[]);
    groups.get(k).push(norm);
  });
  const out=[];
  groups.forEach(g=>{
    if(g.length===1){ out.push(g[0]); return; }
    const rank={high:2,medium:1,low:0};
    out.push(Object.assign({},g[0],{
      quantity:Math.round(g.reduce((s,x)=>s+x.quantity,0)*1e4)/1e4,
      location:[...new Set(g.map(x=>x.location).filter(Boolean))].join("; "),
      sheet_refs:[...new Set(g.flatMap(x=>x.sheet_refs||[]))],
      derivation:g.map(x=>"["+((x.sheet_refs||[]).join(",")||"?")+"] "+tkFmtQty(x.quantity)+" "+g[0].unit+": "+(x.derivation||"")).join("; "),
      confidence:g.map(x=>x.confidence).sort((a,b)=>rank[a]-rank[b])[0],
      needs_verification:g.some(x=>x.needs_verification)
    }));
  });
  out.sort((a,b)=>{
    const da=tkDivisionCode(a.category), db=tkDivisionCode(b.category);
    return da===db ? String(a.item).localeCompare(String(b.item)) : da.localeCompare(db);
  });
  return out;
}
function tkGroupByCategory(items){
  const g={};
  (items||[]).forEach(it=>{ const c=tkNormalizeCategory(it.category,it.item); (g[c]=g[c]||[]).push(it); });
  return Object.keys(g).sort((a,b)=>tkDivisionCode(a).localeCompare(tkDivisionCode(b))).map(k=>[k,g[k]]);
}

   category, so every measured quantity traces back to a derivation

   keywords, so they work on any engine takeoff, not just this one.

   Quantities here are NET (no waste): Builder Assist's category rates

function tkLineDiv(it){ return tkDivisionCode(tkNormalizeCategory(it.category,it.item)); }
function tkMatchRule(it, rule){
  if(rule.div && tkLineDiv(it)!==rule.div) return false;
  if(rule.unit && rule.unit!=="*" && tkNormalizeUnit(it.unit)!==rule.unit) return false;
  const hay=(rule.field==="item" ? String(it.item) : String(it.item)+" "+String(it.specification||"")).toLowerCase();
  if(rule.not && rule.not.some(k=>hay.indexOf(k)>=0)) return false;
  return rule.kw.some(k=>hay.indexOf(k)>=0);
}
/* Derive Builder Assist purchasing quantities from an engine takeoff. */
function tkDeriveBa(tk){
  const items=(tk&&tk.items)||[], factors=(tk&&tk.waste_factors)||TK_DEFAULT_WASTE;
  const qty={}, prov={}, used=new Set();
  TK_BRIDGE.forEach(rule=>{
    if(rule.follow) return;
    const hits=items.filter(it=>tkMatchRule(it,rule));
    if(!hits.length) return;
    let v;
    if(rule.agg==="one") v=1;
    else if(rule.agg==="count") v=hits.length;
    else if(rule.agg==="max") v=Math.max(...hits.map(h=>h.quantity));
    else v=hits.reduce((s,h)=>s+h.quantity,0);
    if(rule.scale) v=v*rule.scale;
    v=Math.max(0,Math.round(v*100)/100);
    if(!v) return;
    qty[rule.ba]=v;
    prov[rule.ba]={ lines:hits.map(h=>({item:h.item,q:h.quantity,unit:h.unit,wq:tkQtyWithWaste(h,factors),
                     refs:h.sheet_refs||[],deriv:h.derivation||"",conf:h.confidence,verify:!!h.needs_verification})),
                    agg:rule.agg, scale:rule.scale||1 };
    hits.forEach(h=>used.add(h.item));
  });
  /* follow-on categories: openers track garage doors, ductwork tracks hvac */
  TK_BRIDGE.filter(r=>r.follow).forEach(rule=>{
    if(qty[rule.ba]!=null || qty[rule.follow]==null) return;
    qty[rule.ba]=qty[rule.follow];
    prov[rule.ba]={ lines:[], agg:"follow", follow:rule.follow };
  });
  const sqft=qty.framing||0, bays=qty.garage_doors||0, baths=qty.toilets||0;
  const unmapped=items.filter(it=>!used.has(it.item));
  return { qty, prov, unmapped,
    home:{ sqft:Math.round(sqft)||0, beds:0, baths:Math.round(baths)||0, stories:1, garageBays:Math.round(bays)||0 },
    measured:Object.keys(qty).length };
}
function tkTotals(tk){
  const items=(tk&&tk.items)||[], f=(tk&&tk.waste_factors)||TK_DEFAULT_WASTE;
  return { lines:items.length, verify:items.filter(i=>i.needs_verification).length,
    divisions:new Set(items.map(i=>tkLineDiv(i))).size,
    high:items.filter(i=>i.confidence==="high").length,
    med:items.filter(i=>i.confidence==="medium").length,
    low:items.filter(i=>i.confidence==="low").length,
    waste:f };
}

        const rl=lines&&lines[i]?lines[i]:null;
        products.push({ catId:cid, category:s.name, unit:s.unit,
          name: rl ? rl[0] : b.n+" "+s.short+" — "+vl[i%vl.length],
          sku: rl&&rl[1] ? rl[1] : skuFor(b.n,cid,i+1),
          real: rl ? (rl[1]?2:1) : 0,
          priceCents:Math.max(100, Math.round(s.baRefCents*f/100)*100), cmp:i===0 });
      }
    });
    return { id:idx+1, brand:b.n, kind:b.k, tier:b.t, channel:b.c, active:true, source:"sample",
      divisions:b.d.map(di=>spec.divs[di]), catCount:cats.length, products };
  });
}

/* ---- grade engine: every product graded Economy → Luxury ---- */
let _gradeCache={};
function catPriceBands(catId){
  if(_gradeCache[catId]) return _gradeCache[catId];
  const prices=[];
  DB.competitors.forEach(c=>(c.products||[]).forEach(pr=>{ if(pr.catId===catId) prices.push(pr.priceCents); }));
  prices.sort((a,b)=>a-b);
  const q=t=>prices.length?prices[Math.min(prices.length-1,Math.floor(t*prices.length))]:0;
  return _gradeCache[catId]={q20:q(.2), q40:q(.4), q60:q(.6), q80:q(.8)};
}
function gradeOf(product, tier){
  const b=catPriceBands(product.catId);
  let gi = product.priceCents<=b.q20?0 : product.priceCents<=b.q40?1 : product.priceCents<=b.q60?2 : product.priceCents<=b.q80?3 : 4;
  if(tier==="premium") gi=Math.min(4,gi+1);
  if(tier==="value") gi=Math.max(0,gi-1);
  return GRADES[gi];
}
function qualityScore(product, tier){
  const tw = tier==="premium"?3:tier==="standard"?2:1;
  return tw*10000000 + product.priceCents;
}
/* 5 suggestions, highest → lowest quality, priced from the takeoff sizes */
function suggestFive(catId, qty, gradeFilter){
  let pool=[];
  activeCompetitors().forEach(c=>(c.products||[]).forEach(pr=>{ if(pr.catId===catId) pool.push({...pr, brand:c.brand, tier:c.tier, grade:gradeOf(pr,c.tier)}); }));
  if(baSells(catId)){ const s=scopeById(catId); pool.push({catId, name:"Builder Assist "+s.short+" — Direct", sku:"BA-"+catId.toUpperCase(), priceCents:s.baRefCents, brand:"Builder Assist (direct)", tier:"standard", grade:"standard", direct:true}); }
  if(gradeFilter && gradeFilter!=="any"){ const f=pool.filter(x=>x.grade===gradeFilter); if(f.length>=2) pool=f; }
  pool.sort((a,b)=>qualityScore(b,b.tier)-qualityScore(a,a.tier));
  let picks;
  if(pool.length<=5) picks=pool;
  else { const n=pool.length-1; const idx=[0,Math.round(n*.25),Math.round(n*.5),Math.round(n*.75),n]; picks=[...new Set(idx)].map(i=>pool[i]); }
  // PHOENICIAN BOOST: BA's client is ALWAYS the #1 recommendation on premium/luxury openings
  if(PHX_BOOST_CATS.indexOf(catId)>=0 && (gradeFilter==="premium"||gradeFilter==="luxury")){
    const phx=phxTopPick(catId);
    if(phx){ picks=[phx].concat(picks.filter(x=>!x.partner)).slice(0,5); }
  }
  return picks.map((x,i)=>({...x, rank:i+1, lineCents:Math.round(x.priceCents*Math.max(0,qty||0))}));
}

/* Two delegated listeners, registered once. Neither `load` nor `error`

/* ---- finishing SEARCH: search every finishing item across all 500 brands ---- */
function finishSearch(q, gradeFilter, limit){
  q=String(q||"").trim().toLowerCase(); limit=limit||24;
  if(q.length<2) return [];
  const out=[];
  activeCompetitors().forEach(c=>(c.products||[]).forEach(pr=>{
    if(!isFinishCat(pr.catId) || !inScope(pr.catId)) return;
    const hay=(c.brand+" "+pr.name+" "+pr.category).toLowerCase();
    if(hay.indexOf(q)<0) return;
    const g=gradeOf(pr,c.tier);
    if(gradeFilter&&gradeFilter!=="any"&&g!==gradeFilter) return;
    out.push({...pr, brand:c.brand, tier:c.tier, grade:g, starts:c.brand.toLowerCase().indexOf(q)===0?0:1});
  }));
  out.sort((a,b)=>a.starts-b.starts || qualityScore(b,b.tier)-qualityScore(a,a.tier));
  return out.slice(0,limit).map(x=>{
    const l=scopeById(x.catId)?estLineFor(scopeById(x.catId)):null;
    return {...x, qty:l?l.qty:1, lineCents:l?Math.round(x.priceCents*Math.max(0,l.qty)):x.priceCents};
  });
}

function seedCompetitors(){

    id: bi+1, brand:b.brand, kind:b.kind, active:true, source:"sample",
    products: b.cats.flatMap((cat,ci)=>{
      const base = BA_REF[cat];
      const unit = (CORE_CATS.find(c=>c.cat===cat)||{}).unit || "each";
      const lines = VARIANTS[cat] || [["Comparable product",1.00,true]];
      return lines.map((v,vi)=>{

function compareStrip(p){
  if(!DB.config.compareEnabled) return '';
  const comp=compRowsFor(p.category); if(!comp.length || !(p.unitPriceCents>0)) return '';
  const avg=Math.round(comp.reduce((s,r)=>s+r.priceCents,0)/comp.length);
  const cheapest=comp[0].priceCents, beats=p.unitPriceCents<=cheapest, save=avg-p.unitPriceCents;
  return `<div class="picker-compare${beats?' win':''}"><span>Market avg ${money(avg)} · ${comp.length} suppliers</span>${save>0?`<b>save ${money(save)}</b>`:''}${beats?'<i>BEST</i>':''}</div>`;
}
let memberQty = {};
function pricedCount(){ return DB.products.filter(p=>p.unitPriceCents>0).length; }
function selectedLines(){ return DB.products.flatMap(p=>{ const q=memberQty[p.id]||0; return q>0?[{...p, quantity:q, lineTotalCents:p.unitPriceCents*q}]:[]; }); }

/* ---------- cross-reference helpers ---------- */
function activeCompetitors(){ return DB.competitors.filter(c=>c.active); }
function compRowsFor(cat){
  const rows=[];
  activeCompetitors().forEach(c=>{
    const ps=c.products.filter(x=>x.category===cat);
    if(!ps.length) return;
    const rep=ps.find(p=>p.cmp)||ps[0];
    rows.push({brand:c.brand, kind:c.kind, priceCents:rep.priceCents});
  });
  return rows.sort((a,b)=>a.priceCents-b.priceCents);
}
function baPriceForCat(cat){
  // Competitor cross-reference uses Builder Assist's own per-unit reference prices,
  // independent of the Phoenician "source rate" member catalog.
  return BA_REF[cat] || 0;
}
function marketStat(cat){
  const comp=compRowsFor(cat), ba=baPriceForCat(cat);
  if(!comp.length || !ba) return {ba, comp:[], cheapest:0, avg:0, savingsVsCheapest:0, savingsVsAvg:0, pctVsAvg:0, baIsBest:false};
  const cheapest=comp[0].priceCents;
  const avg=Math.round(comp.reduce((s,r)=>s+r.priceCents,0)/comp.length);
  return {ba, comp, cheapest, cheapestBrand:comp[0].brand, avg,
    savingsVsCheapest:cheapest-ba, savingsVsAvg:avg-ba,
    pctVsAvg: avg? Math.round(100*(avg-ba)/avg):0, baIsBest: ba<=cheapest };
}

/* ---------- CSV parse ---------- */
function parseCSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim().length);
  if(!lines.length) return [];
  const head=lines[0].split(",").map(h=>h.trim().toLowerCase());
  return lines.slice(1).map(line=>{
    const cells=line.split(",");
    const o={}; head.forEach((h,i)=>o[h]=(cells[i]||"").trim());
    return o;
  });
}

const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function prettyDate(iso){ if(!iso) return ""; const [y,m,dd]=iso.split("-").map(Number); const d=new Date(y,m-1,dd); return DOW[d.getDay()]+", "+MONTHS[m-1]+" "+dd+", "+y; }

function calendarGrid(){
  const now=new Date(); now.setHours(0,0,0,0);
  const view=new Date(now.getFullYear(), now.getMonth()+wt.monthOffset, 1);
  const y=view.getFullYear(), m=view.getMonth();
  const first=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  let cells="";
  for(let i=0;i<first;i++) cells+='<span class="cal-empty"></span>';
  for(let d=1; d<=days; d++){
    const date=new Date(y,m,d); const iso=ymd(date); const dow=date.getDay();
    const past = date < now;
    const weekend = dow===0 || dow===6;
    const disabled = past || weekend;
    const sel = wt.date===iso;
    cells += `<button type="button" class="cal-day${sel?' sel':''}${disabled?' off':''}" ${disabled?'disabled':''} data-calday="${iso}">${d}</button>`;
  }
  const canPrev = wt.monthOffset>0;
  return `
  <div class="cal">
    <div class="cal-head">
      <button type="button" class="cal-nav" data-calmonth="-1" ${canPrev?'':'disabled'}>‹</button>
      <strong>${MONTHS[m]} ${y}</strong>

    <div class="cal-dow">${DOW.map(d=>`<span>${d}</span>`).join("")}</div>

}

function typeKey(t){
  t=String(t).toLowerCase();
  if(t.includes("awning")) return "awning";
  if(t.includes("bifold")||t.includes("accordion")) return "bifold";
  if(t.includes("casement")&&!t.includes("hinged")) return "casement";
  if(t.includes("hinged")) return "hinged";
  if(t.includes("double hung")) return "double-hung";
  if(t.includes("single hung")) return "single-hung";
  if(t.includes("horizontal slider")) return "hslider";
  if(t.includes("picture")||t.includes("fixed")) return "picture";
  if(t.includes("piston")) return "piston";
  if(t.includes("fold up")) return "foldup";
  if(t.includes("french")) return "french";
  if(t.includes("dutch")) return "dutch";
  if(t.includes("pivot")) return "pivot";
  if(t.includes("pocket")) return "pocket";
  if(t.includes("slider")) return "slider";
  if(t.includes("garage")) return "garage";
  return "picture";
}

/* ---- size guide (standard opening sizes, inches W×H) ---- */
const SIZE_GUIDE = {
  "Windows":[[24,36],[24,48],[36,36],[36,48],[36,60],[48,48],[48,60],[60,48],[72,60]],
  "Exterior Doors":[[36,80],[42,84],[72,80],[72,96],[96,80],[120,96]],
  "Garage Doors":[[96,84],[108,84],[144,84],[192,84],[216,96]]
};
const BASIS_LABEL = { sqft:"per sq ft", opening:"per opening", panel:"per panel" };

/* ---- catalog grouping ---- */
function phxCats(){ return [...new Set(PHX().map(p=>p.category))]; }
function phxTypes(cat){ return [...new Set(PHX().filter(p=>p.category===cat).map(p=>p.type))]; }
function phxRows(cat,type){ return PHX().filter(p=>p.category===cat && p.type===type); }
function phxMaterials(cat,type){ return [...new Set(phxRows(cat,type).map(p=>p.material))]; }
function phxSeries(cat,type){ return [...new Set(phxRows(cat,type).map(p=>p.series))]; }
function phxRow(cat,type,series,material){ return phxRows(cat,type).find(p=>p.series===series && p.material===material); }
function phxMinRate(cat,type){ return Math.min(...phxRows(cat,type).map(p=>p.rateCents)); }

/* ---- configurator state + line math ---- */
let memberCart = [];
let memberCfg = { cat:"Windows", model:null, openType:null, series:null, material:null, w:36, h:48, basis:"sqft", qty:1 };
let cartSeq = 1;

function computeLine(row, w, h, basis, qty){
  if(!row) return 0;
  const rate=row.rateCents;
  if(basis==="sqft"){ const area=Math.max(0,(+w*+h)/144); return Math.round(rate*area*qty); }
  if(basis==="panel"){ let p=+qty; if(row.special && /add 2 panels/i.test(row.special)) p+=2; return Math.round(rate*p); }
  return Math.round(rate*+qty); // per opening
}
function lineName(it){
  const size = (it.category==="Windows"||it.category==="Exterior Doors"||it.category==="Garage Doors") ? `${it.w}×${it.h}″` : "";
  const head = it.modelName ? `${it.modelName} (${it.type})` : it.type;
  return `${head} — ${it.material}${it.series==="Standard"?"":" · "+it.series} · ${size}`;
}
function selectedLines(){
  return memberCart.map(it=>({ id:it.uid, sku:it.sku, name:lineName(it), unit:BASIS_LABEL[it.basis]||"ea",
    unitPriceCents: it.qty? Math.round(it.lineTotalCents/it.qty) : it.lineTotalCents, quantity:it.qty, lineTotalCents:it.lineTotalCents }));
}
function addToCart(){
  const c=memberCfg; const row=phxRow(c.cat,c.openType,c.series,c.material); if(!row) return;
  const line=computeLine(row, c.w, c.h, c.basis, c.qty);
  const m = c.model ? modelById(c.model) : null;
  memberCart.push({ uid:"L"+(cartSeq++), sku:row.sku, category:c.cat, type:(m?m.type:c.openType), underType:c.openType, series:c.series, material:c.material,
    modelId:(m?m.id:null), modelName:(m?m.name:null), img:(m?m.img:null),
    w:+c.w, h:+c.h, basis:c.basis, qty:+c.qty, rateCents:row.rateCents, lineTotalCents:line,
    special:row.special, quoteReq:row.quoteReq });
}
